name = "clawrouter-edge"
main = ".wrangler/large-http/worker.mjs"
no_bundle = true
compatibility_date = "2026-06-05"
compatibility_flags = ["enable_request_signal"]
keep_vars = true

# Retain bounded structured diagnostics without per-request invocation logs.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false

[triggers]
crons = ["*/5 * * * *"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[build]
command = "pnpm provider:compile -- --output worker/generated/provider-snapshot.json && pnpm --dir admin build && node scripts/build-default-worker.mjs"

[assets]
directory = ".wrangler/large-http/assets"
binding = "ASSETS"
run_worker_first = true

[[queues.producers]]
binding = "USAGE_QUEUE"
queue = "clawrouter-usage"

[[queues.consumers]]
queue = "clawrouter-usage"
dead_letter_queue = "clawrouter-usage-dead-letter"
max_batch_size = 50
max_batch_timeout = 5
max_retries = 5

[[r2_buckets]]
binding = "CONTENT_ARCHIVE"
bucket_name = "clawrouter-content"

[[durable_objects.bindings]]
name = "BUDGET_LEDGER"
class_name = "BudgetLedgerObject"

[[durable_objects.bindings]]
name = "USAGE_LEDGER"
class_name = "UsageLedgerObject"

[[durable_objects.bindings]]
name = "ACCESS_CONTROL"
class_name = "PolicyBindingIndexObject"

[[durable_objects.bindings]]
name = "GRANT_CREDENTIALS"
class_name = "GrantCredentialObject"

[[durable_objects.bindings]]
name = "CONTENT_CLEANUP"
class_name = "ContentArchiveCleanupObject"

[[durable_objects.bindings]]
name = "LARGE_HTTP_POOL"
class_name = "LargeHttpPool"

[[durable_objects.bindings]]
name = "LARGE_HTTP_SLOTS"
class_name = "LargeHttpSlot"

[[containers]]
name = "clawrouter-edge-large-http"
class_name = "LargeHttpSlot"
scheduling_policy = "durable_object"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BudgetLedgerObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UsageLedgerObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PolicyBindingIndexObject"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["GrantCredentialObject"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["ContentArchiveCleanupObject"]

[[migrations]]
tag = "v6-large-http"
new_sqlite_classes = ["LargeHttpPool", "LargeHttpSlot"]

[[routes]]
pattern = "clawrouter.openclaw.ai"
custom_domain = true
