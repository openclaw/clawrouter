# Frozen Step Plan contract and regional eligibility: docs/stepfun-plan.md.
# Primary endpoint checked 2026-11-03; no standard API or cross-region key fallback.
schema: clawrouter.service-provider.v1
id: stepfun-plan-cn
displayName: StepFun Step Plan (China)
status: experimental
class: openai_compatible
service:
  platform: stepfun
  kind: model_provider
  upstreamService: stepfun-plan-cn
  configKeys: [STEPFUN_PLAN_CN_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.stepfun.com/step_plan/v1
routing:
  nativePrefixes: [clawrouter-stepfun-plan-cn, stepfun-plan-cn]
  modelPrefixes: [stepfun-plan-cn/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: stepfun-plan-cn/step-3.7-flash
      displayName: "Step 3.7 Flash"
      upstream: step-3.7-flash
      capabilities: [llm.chat]
    - id: stepfun-plan-cn/step-3.5-flash
      displayName: "Step 3.5 Flash"
      upstream: step-3.5-flash
      capabilities: [llm.chat]
    - id: stepfun-plan-cn/step-3.5-flash-2603
      displayName: "Step 3.5 Flash (2603)"
      upstream: step-3.5-flash-2603
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
