# Standard API only; region and plan contracts: docs/hosted-platform-providers.md.
# Endpoint/model source checked 2026-11-03: https://www.stepfun.com/
schema: clawrouter.service-provider.v1
id: stepfun
displayName: StepFun global standard API
status: experimental
class: openai_compatible
service:
  platform: stepfun
  kind: model_provider
  upstreamService: stepfun
  configKeys: [STEPFUN_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.stepfun.ai/v1
routing:
  nativePrefixes: [clawrouter-stepfun, stepfun]
  modelPrefixes: [stepfun/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: stepfun/step-3.7-flash
      upstream: step-3.7-flash
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
