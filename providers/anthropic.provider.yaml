schema: clawrouter.service-provider.v1
id: anthropic
displayName: Anthropic
status: stable
class: anthropic_compatible
service:
  platform: anthropic
  kind: model_provider
  upstreamService: anthropic
  configKeys: [ANTHROPIC_API_KEY]
auth:
  schemes:
    - type: api_key
      header: x-api-key
      secretKind: api_key
  refresh:
    tokenUrl: https://platform.claude.com/v1/oauth/token
    clientId: 9d1c250a-e61b-44d9-88ed-5944d1962f5e
    requestFormat: json
  grantTransports:
    subscription:
      auth:
        type: bearer
        header: Authorization
        format: "Bearer ${secret}"
      headers:
        accept: application/json
        anthropic-dangerous-direct-browser-access: "true"
        user-agent: claude-cli/2.1.75
        x-app: cli
      appendHeaders:
        anthropic-beta: claude-code-20250219,oauth-2025-04-20
      requestTransforms:
        prependSystem:
          - type: text
            text: "x-anthropic-billing-header: cc_version=2.1.75; cc_entrypoint=sdk-cli;"
          - type: text
            text: "You are Claude Code, Anthropic's official CLI for Claude."
      maintenance:
        quotaPoll:
          normalIntervalSeconds: 240
          urgentIntervalSeconds: 60
          exhaustedIntervalSeconds: 600
          urgentRemainingPercent: 20
        keepWarm:
          intervalSeconds: 17700
          endpoint: messages
          body:
            model: claude-sonnet-5
            max_tokens: 1
            messages:
              - role: user
                content: "."
baseUrls:
  default: https://api.anthropic.com
routing:
  nativePrefixes: [clawrouter-anthropic, anthropic]
  modelPrefixes: [anthropic/]
adapter:
  request: anthropic
  response: anthropic
  stream: anthropic_sse
  error: anthropic_error
  passthroughHeaders: [anthropic-beta, anthropic-version]
  injectHeaders:
    anthropic-version: "2023-06-01"
quota:
  responseHeaders:
    - id: rpm
      kind: requests
      unit: request
      window: minute
      limitHeaders: [anthropic-ratelimit-requests-limit]
      remainingHeaders: [anthropic-ratelimit-requests-remaining]
      resetHeaders: [anthropic-ratelimit-requests-reset]
    - id: tpm
      kind: tokens
      unit: token
      window: minute
      limitHeaders: [anthropic-ratelimit-tokens-limit]
      remainingHeaders: [anthropic-ratelimit-tokens-remaining]
      resetHeaders: [anthropic-ratelimit-tokens-reset]
    - id: itpm
      kind: input_tokens
      unit: token
      window: minute
      limitHeaders: [anthropic-ratelimit-input-tokens-limit]
      remainingHeaders: [anthropic-ratelimit-input-tokens-remaining]
      resetHeaders: [anthropic-ratelimit-input-tokens-reset]
    - id: otpm
      kind: output_tokens
      unit: token
      window: minute
      limitHeaders: [anthropic-ratelimit-output-tokens-limit]
      remainingHeaders: [anthropic-ratelimit-output-tokens-remaining]
      resetHeaders: [anthropic-ratelimit-output-tokens-reset]
  probes:
    - grantKinds: [subscription]
      url: https://api.anthropic.com/api/oauth/usage
      headers:
        User-Agent: openclaw
        anthropic-version: "2023-06-01"
        anthropic-beta: oauth-2025-04-20
      windows:
        - id: subscription-five-hour
          kind: subscription
          unit: percent
          window: five_hour
          fixedLimit: 100
          usedPointer: /five_hour/utilization
          resetPointer: /five_hour/resets_at
        - id: subscription-seven-day
          kind: subscription
          unit: percent
          window: seven_day
          fixedLimit: 100
          usedPointer: /seven_day/utilization
          resetPointer: /seven_day/resets_at
        - id: subscription-seven-day-sonnet
          kind: subscription
          unit: percent
          window: seven_day_sonnet
          fixedLimit: 100
          usedPointer: /seven_day_sonnet/utilization
          resetPointer: /seven_day_sonnet/resets_at
        - id: subscription-seven-day-opus
          kind: subscription
          unit: percent
          window: seven_day_opus
          fixedLimit: 100
          usedPointer: /seven_day_opus/utilization
          resetPointer: /seven_day_opus/resets_at
capabilities:
  - id: llm.messages
    endpoint: messages
    methods: [POST]
  - id: llm.count_tokens
    endpoint: count_tokens
    methods: [POST]
endpoints:
  messages:
    path: /v1/messages
    requestHeaders: [anthropic-beta, anthropic-version]
    requestFormat: anthropic.messages
    responseFormat: anthropic.messages
    streaming: sse
    timeoutMs: 600000
  count_tokens:
    path: /v1/messages/count_tokens
    requestHeaders: [anthropic-beta, anthropic-version]
    requestFormat: anthropic.messages
    responseFormat: anthropic.count_tokens
    timeoutMs: 120000
models:
  entries:
    - id: anthropic/claude-opus-5
      upstream: claude-opus-5
      capabilities: [llm.messages, llm.count_tokens]
      pricingRef: anthropic-claude-opus-5-standard-2026-08-27
      pricing:
        effectiveAt: "2026-08-27"
        source: https://platform.claude.com/docs/en/about-claude/pricing
        inputMicrosPerMillion: 5000000
        cachedInputMicrosPerMillion: 500000
        cacheWrite5mInputMicrosPerMillion: 6250000
        cacheWrite1hInputMicrosPerMillion: 10000000
        outputMicrosPerMillion: 25000000
        maxInputTokens: 1000000
        defaultMaxOutputTokens: 128000
    - id: anthropic/claude-sonnet-5
      upstream: claude-sonnet-5
      capabilities: [llm.messages, llm.count_tokens]
      pricingRef: anthropic-claude-sonnet-5-standard-2026-08-27
      pricing:
        effectiveAt: "2026-08-27"
        source: https://platform.claude.com/docs/en/about-claude/pricing
        inputMicrosPerMillion: 2000000
        cachedInputMicrosPerMillion: 200000
        cacheWrite5mInputMicrosPerMillion: 2500000
        cacheWrite1hInputMicrosPerMillion: 4000000
        outputMicrosPerMillion: 10000000
        maxInputTokens: 1000000
        defaultMaxOutputTokens: 128000
    - id: anthropic/claude-fable-5
      upstream: claude-fable-5
      capabilities: [llm.messages, llm.count_tokens]
      pricingRef: anthropic-claude-fable-5-standard-2026-08-28
      pricing:
        effectiveAt: "2026-08-28"
        source: https://platform.claude.com/docs/en/about-claude/pricing
        inputMicrosPerMillion: 10000000
        cachedInputMicrosPerMillion: 1000000
        cacheWrite5mInputMicrosPerMillion: 12500000
        cacheWrite1hInputMicrosPerMillion: 20000000
        outputMicrosPerMillion: 50000000
        maxInputTokens: 1000000
        defaultMaxOutputTokens: 128000
    - id: anthropic/claude-opus-4-8
      upstream: claude-opus-4-8
      capabilities: [llm.messages, llm.count_tokens]
      pricingRef: anthropic-claude-opus-4-8-standard-2026-06-22
      pricing:
        effectiveAt: "2026-06-22"
        source: https://platform.claude.com/docs/en/about-claude/pricing
        inputMicrosPerMillion: 5000000
        cachedInputMicrosPerMillion: 500000
        cacheWrite5mInputMicrosPerMillion: 6250000
        cacheWrite1hInputMicrosPerMillion: 10000000
        outputMicrosPerMillion: 25000000
        maxInputTokens: 1000000
        defaultMaxOutputTokens: 128000
    - id: anthropic/claude-sonnet-4-6
      upstream: claude-sonnet-4-6
      capabilities: [llm.messages, llm.count_tokens]
      pricingRef: anthropic-claude-sonnet-4-6-standard-2026-06-22
      pricing:
        effectiveAt: "2026-06-22"
        source: https://platform.claude.com/docs/en/about-claude/pricing
        inputMicrosPerMillion: 3000000
        cachedInputMicrosPerMillion: 300000
        cacheWrite5mInputMicrosPerMillion: 3750000
        cacheWrite1hInputMicrosPerMillion: 6000000
        outputMicrosPerMillion: 15000000
        maxInputTokens: 1000000
        defaultMaxOutputTokens: 64000
    - id: anthropic/claude-haiku-4-5
      upstream: claude-haiku-4-5
      capabilities: [llm.messages, llm.count_tokens]
      pricingRef: anthropic-claude-haiku-4-5-standard-2026-06-22
      pricing:
        effectiveAt: "2026-06-22"
        source: https://platform.claude.com/docs/en/about-claude/pricing
        inputMicrosPerMillion: 1000000
        cachedInputMicrosPerMillion: 100000
        cacheWrite5mInputMicrosPerMillion: 1250000
        cacheWrite1hInputMicrosPerMillion: 2000000
        outputMicrosPerMillion: 5000000
        maxInputTokens: 200000
        defaultMaxOutputTokens: 64000
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
  counters:
    - name: input_tokens
      source: usage.input_tokens
      unit: token
    - name: output_tokens
      source: usage.output_tokens
      unit: token
