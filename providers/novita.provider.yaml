# Frozen native Chat inventory: docs/novita-native-catalog.md. Discovery activation is separate.
# Endpoint/model source checked 2026-11-03: https://docs.novita.ai/api-reference/model-apis-llm-create-chat-completion
schema: clawrouter.service-provider.v1
id: novita
displayName: Novita AI
status: experimental
class: openai_compatible
service:
  platform: novita
  kind: model_provider
  upstreamService: novita
  configKeys: [NOVITA_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.novita.ai/openai/v1
routing:
  nativePrefixes: [clawrouter-novita, novita, novita-ai, novitaai]
  modelPrefixes: [novita/, novita-ai/, novitaai/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: models.list
    endpoint: models_list
    methods: [GET]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  models_list:
    path: /models
    method: GET
    nativeProxy: true
    requestFormat: novita.models
    responseFormat: novita.models
    headers:
      accept: application/json
    timeoutMs: 10000
models:
  entries:
    - id: novita/stepfun/step-3.7-flash
      upstream: stepfun/step-3.7-flash
      capabilities: [llm.chat]
    - id: novita/moonshotai/kimi-k3
      upstream: moonshotai/kimi-k3
      capabilities: [llm.chat]
      requestParameters:
        chat_completions:
          sources: [https://novita.ai/models/model-detail/moonshotai-kimi-k3]
          checkedAt: "2026-11-03"
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://novita.ai/models/model-detail/moonshotai-kimi-k3]
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 1048576
            maxOutputTokens: 1048576
    - id: novita/moonshotai/kimi-k2.7-code
      upstream: moonshotai/kimi-k2.7-code
      capabilities: [llm.chat]
