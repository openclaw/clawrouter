# Hosted Chat API only; product boundaries: docs/hosted-regional-providers.md.
# Endpoint/model source checked 2026-11-03: https://docs.novita.ai/api-reference/model-apis-llm-create-chat-completion
schema: clawrouter.service-provider.v1
id: novita
displayName: Novita AI
status: experimental
class: openai_compatible
service:
  platform: novita
  kind: model_provider
  upstreamService: novita
  configKeys: [NOVITA_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.novita.ai/openai/v1
routing:
  nativePrefixes: [clawrouter-novita, novita, novita-ai, novitaai]
  modelPrefixes: [novita/, novita-ai/, novitaai/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: novita/stepfun/step-3.7-flash
      upstream: stepfun/step-3.7-flash
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
