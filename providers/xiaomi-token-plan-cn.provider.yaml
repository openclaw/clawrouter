# Frozen Token Plan regions and retirement dispositions: docs/xiaomi-token-plan.md.
# Primary endpoint checked 2026-11-03; no standard API or cross-region key fallback.
schema: clawrouter.service-provider.v1
id: xiaomi-token-plan-cn
displayName: Xiaomi Token Plan (China)
status: experimental
class: openai_compatible
service:
  platform: xiaomi
  kind: model_provider
  upstreamService: xiaomi-token-plan-cn
  configKeys: [XIAOMI_TOKEN_PLAN_CN_API_KEY]
auth:
  schemes:
    - type: api_key
      header: api-key
      secretKind: api_key
baseUrls:
  default: https://token-plan-cn.xiaomimimo.com/v1
routing:
  nativePrefixes: [clawrouter-xiaomi-token-plan-cn, xiaomi-token-plan-cn]
  modelPrefixes: [xiaomi-token-plan-cn/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: xiaomi-token-plan-cn/mimo-v2.6-pro
      upstream: mimo-v2.6-pro
      capabilities: [llm.chat]
    - id: xiaomi-token-plan-cn/mimo-v2.6-flash
      upstream: mimo-v2.6-flash
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
