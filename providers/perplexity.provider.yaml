schema: clawrouter.service-provider.v1
id: perplexity
displayName: Perplexity
status: stable
class: openai_compatible
service:
  platform: perplexity
  kind: model_provider
  upstreamService: perplexity
  configKeys: [PERPLEXITY_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.perplexity.ai
routing:
  nativePrefixes: [clawrouter-perplexity, perplexity]
  modelPrefixes: [perplexity/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: llm.responses
    endpoint: responses
    methods: [POST]
  - id: llm.responses
    endpoint: agent
    methods: [POST]
  - id: web.search
    endpoint: search
    methods: [POST]
endpoints:
  responses:
    modelPassthrough: {}
    path: /v1/responses
    requestFormat: openai.responses
    responseFormat: openai.responses
    streaming: sse
    timeoutMs: 600000
  agent:
    modelPassthrough: {}
    path: /v1/agent
    requestFormat: openai.responses
    responseFormat: openai.responses
    streaming: sse
    timeoutMs: 600000
  search:
    path: /search
    requestFormat: perplexity.search
    responseFormat: perplexity.search
    timeoutMs: 120000
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: perplexity/sonar-pro
      upstream: sonar-pro
      capabilities: [llm.chat]
      pricingRef: perplexity-sonar-pro-token-rates-2026-09-23
      pricing:
        effectiveAt: "2026-09-23"
        source: https://docs.perplexity.ai/docs/sonar/models/sonar-pro
        unpricedCosts: [request_fee]
        inputMicrosPerMillion: 3000000
        outputMicrosPerMillion: 15000000
        maxInputTokens: 200000
        defaultMaxOutputTokens: 8192
    - id: perplexity/openai/gpt-5.6-sol
      upstream: openai/gpt-5.6-sol
      capabilities: [llm.responses]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          responses:
            sources:
              - https://docs.perplexity.ai/docs/agent-api/quickstart
              - https://docs.perplexity.ai/docs/agent-api/openai-compatibility
            checkedAt: "2026-11-03"
            input: [text]
          agent:
            sources: [https://docs.perplexity.ai/docs/agent-api/quickstart]
            checkedAt: "2026-11-03"
            input: [text]
      # The transport example does not qualify model/tool/session tariffs.
      pricingRef: perplexity-agent-openai-gpt-5-6-sol-unqualified
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
