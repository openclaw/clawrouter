# Hosted Chat API only; product boundaries: docs/hosted-regional-providers.md.
# Endpoint/model source checked 2026-11-03: https://www.gmicloud.ai/en/developers
schema: clawrouter.service-provider.v1
id: gmi
displayName: GMI Cloud
status: experimental
class: openai_compatible
service:
  platform: gmi
  kind: model_provider
  upstreamService: gmi
  configKeys: [GMI_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.gmi-serving.com/v1
routing:
  nativePrefixes: [clawrouter-gmi, gmi, gmi-cloud, gmicloud]
  modelPrefixes: [gmi/, gmi-cloud/, gmicloud/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: gmi/deepseek-ai/DeepSeek-V4-Pro
      upstream: deepseek-ai/DeepSeek-V4-Pro
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
