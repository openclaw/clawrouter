schema: clawrouter.service-provider.v1
id: mistral
displayName: Mistral AI
status: stable
class: openai_compatible
service:
  platform: mistral
  kind: model_provider
  upstreamService: mistral
  configKeys: [MISTRAL_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.mistral.ai
routing:
  nativePrefixes: [clawrouter-mistral, mistral]
  modelPrefixes: [mistral/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: llm.embeddings
    endpoint: embeddings
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  embeddings:
    modelPassthrough: {}
    path: /v1/embeddings
    requestFormat: openai.embeddings
    responseFormat: openai.embeddings
    timeoutMs: 120000
models:
  entries:
    - id: mistral/mistral-medium-3-5
      upstream: mistral-medium-3-5
      capabilities: [llm.chat]
      pricingRef: mistral-medium-3-5-standard-2026-06-22
      pricing:
        effectiveAt: "2026-06-22"
        source: https://docs.mistral.ai/models/model-cards/mistral-medium-3-5-26-04
        inputMicrosPerMillion: 1500000
        outputMicrosPerMillion: 7500000
        maxInputTokens: 262144
        defaultMaxOutputTokens: 65536
    - id: mistral/mistral-small-2603
      upstream: mistral-small-2603
      capabilities: [llm.chat]
      pricingRef: mistral-small-4-standard-2026-06-22
      pricing:
        effectiveAt: "2026-06-22"
        source: https://docs.mistral.ai/getting-started/models/
        inputMicrosPerMillion: 150000
        outputMicrosPerMillion: 600000
        maxInputTokens: 262144
        defaultMaxOutputTokens: 65536
    - id: mistral/mistral-embed
      upstream: mistral-embed
      capabilities: [llm.embeddings]
      pricingRef: mistral-embed-23-12-standard-2026-06-21
      pricing:
        effectiveAt: "2026-06-21"
        source: https://docs.mistral.ai/models/mistral-embed-23-12
        inputMicrosPerMillion: 100000
        outputMicrosPerMillion: 0
        maxInputTokens: 8192
        defaultMaxOutputTokens: 0
    - id: mistral/codestral-latest
      upstream: codestral-latest
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://docs.mistral.ai/models/codestral-25-08
            checkedAt: "2026-11-03"
            input: [text]
            contextWindow: 128000
      pricingRef: mistral-codestral-latest-standard-2026-11-03
      pricing:
        effectiveAt: "2026-11-03"
        checkedAt: "2026-11-03"
        source: https://docs.mistral.ai/inference/pricing
        inputMicrosPerMillion: 300000
        cachedInputMicrosPerMillion: 30000
        outputMicrosPerMillion: 900000
        serviceTiers:
          - id: default
            inputMicrosPerMillion: 300000
            cachedInputMicrosPerMillion: 30000
            outputMicrosPerMillion: 900000
        # Reserve the full context when the caller omits an output limit.
        # This ceiling is not a claim about the provider's default output.
        maxInputTokens: 131072
        defaultMaxOutputTokens: 131072
    - id: mistral/devstral-medium-latest
      upstream: devstral-medium-latest
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://docs.mistral.ai/models/devstral-2-25-12
            checkedAt: "2026-11-03"
            input: [text]
            contextWindow: 262144
      # Deprecated identity retained for frozen client compatibility. No current
      # qualified tariff: do not inherit a replacement model's prices.
    - id: mistral/mistral-large-latest
      upstream: mistral-large-latest
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://docs.mistral.ai/models/mistral-large-3-25-12
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 262144
      # Deprecated identity retained for frozen client compatibility. No current
      # qualified tariff: do not inherit a replacement model's prices.
    - id: mistral/mistral-medium-2508
      upstream: mistral-medium-2508
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://docs.mistral.ai/models/mistral-medium-3-1-25-08
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 128000
      # Deprecated identity retained for frozen client compatibility. No current
      # qualified tariff: do not inherit a replacement model's prices.
    - id: mistral/mistral-small-latest
      upstream: mistral-small-latest
      capabilities: [llm.chat]
      supportedReasoningEfforts: [none, high]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://docs.mistral.ai/models/mistral-small-4-0-26-03
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 262144
      pricingRef: mistral-mistral-small-latest-standard-2026-11-03
      pricing:
        effectiveAt: "2026-11-03"
        checkedAt: "2026-11-03"
        source: https://docs.mistral.ai/inference/pricing
        inputMicrosPerMillion: 150000
        cachedInputMicrosPerMillion: 15000
        outputMicrosPerMillion: 600000
        serviceTiers:
          - id: default
            inputMicrosPerMillion: 150000
            cachedInputMicrosPerMillion: 15000
            outputMicrosPerMillion: 600000
        # Reserve the full context when the caller omits an output limit.
        # This ceiling is not a claim about the provider's default output.
        maxInputTokens: 262144
        defaultMaxOutputTokens: 262144
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
