# Standard API only; region and plan contracts: docs/hosted-platform-providers.md.
# Endpoint/model source checked 2026-11-03: https://docs.byteplus.com/en/docs/modelark/streaming-output?redirect=1
schema: clawrouter.service-provider.v1
id: byteplus
displayName: BytePlus ModelArk Singapore
status: experimental
class: openai_compatible
service:
  platform: byteplus
  kind: model_provider
  upstreamService: byteplus
  configKeys: [BYTEPLUS_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://ark.ap-southeast.bytepluses.com/api/v3
routing:
  nativePrefixes: [clawrouter-byteplus, byteplus]
  modelPrefixes: [byteplus/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: byteplus/dola-seed-2-1-turbo-260628
      upstream: dola-seed-2-1-turbo-260628
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/byteplus/openclaw.plugin.json]
            checkedAt: "2026-11-04"
            input: [text, image]
    - id: byteplus/seed-2-0-code-preview-260328
      upstream: seed-2-0-code-preview-260328
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/byteplus/openclaw.plugin.json]
            checkedAt: "2026-11-04"
            input: [text, image]
    - id: byteplus/glm-5-2-260617
      upstream: glm-5-2-260617
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/byteplus/openclaw.plugin.json]
            checkedAt: "2026-11-04"
            input: [text]
    - id: byteplus/deepseek-v4-pro-260425
      upstream: deepseek-v4-pro-260425
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/byteplus/openclaw.plugin.json]
            checkedAt: "2026-11-04"
            input: [text]
    - id: byteplus/deepseek-v4-flash-260425
      upstream: deepseek-v4-flash-260425
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
