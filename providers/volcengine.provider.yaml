# Standard API only; region and plan contracts: docs/hosted-platform-providers.md.
# Endpoint/model source checked 2026-11-03: https://docs.volcengine.com/docs/ark/text-generation?lang=en
schema: clawrouter.service-provider.v1
id: volcengine
displayName: Volcengine Ark Beijing
status: experimental
class: openai_compatible
service:
  platform: volcengine
  kind: model_provider
  upstreamService: volcengine
  configKeys: [VOLCANO_ENGINE_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://ark.cn-beijing.volces.com/api/v3
routing:
  nativePrefixes: [clawrouter-volcengine, volcengine]
  modelPrefixes: [volcengine/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: volcengine/doubao-seed-2-1-pro-260915
      displayName: "Doubao Seed 2.1 Pro (260915)"
      upstream: doubao-seed-2-1-pro-260915
      capabilities: [llm.chat]
    - id: volcengine/doubao-seed-evolving
      displayName: "Doubao Seed Evolving"
      upstream: doubao-seed-evolving
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/volcengine/openclaw.plugin.json]
            checkedAt: "2026-11-04"
