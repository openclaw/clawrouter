schema: clawrouter.service-provider.v1
id: fireworks
displayName: Fireworks AI
status: stable
class: openai_compatible
service:
  platform: fireworks
  kind: model_provider
  upstreamService: fireworks
  configKeys: [FIREWORKS_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.fireworks.ai/inference
routing:
  nativePrefixes: [clawrouter-fireworks, fireworks]
  modelPrefixes: [fireworks/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: fireworks/glm-5.2
      upstream: accounts/fireworks/models/glm-5p2
      capabilities: [llm.chat]
      supportedReasoningEfforts: [none, low, medium, high, xhigh, max]
      requestParameters:
        chat_completions:
          sources:
            - https://docs.fireworks.ai/api-reference/post-chatcompletions
          checkedAt: "2026-09-23"
          defaultReasoningEffort: max
      pricingRef: fireworks-glm-5p2-standard-2026-06-22
      pricing:
        effectiveAt: "2026-06-22"
        source: https://fireworks.ai/blog/glm-5p2
        inputMicrosPerMillion: 1400000
        cachedInputMicrosPerMillion: 260000
        outputMicrosPerMillion: 4400000
        maxInputTokens: 1048576
        defaultMaxOutputTokens: 131072
    - id: fireworks/gpt-oss-120b
      upstream: accounts/fireworks/models/gpt-oss-120b
      capabilities: [llm.chat]
      supportedReasoningEfforts: [low, medium, high]
      requestParameters:
        chat_completions:
          sources:
            - https://docs.fireworks.ai/api-reference/post-chatcompletions
          checkedAt: "2026-09-23"
          defaultReasoningEffort: medium
      pricingRef: fireworks-gpt-oss-120b-tiers-2026-11-03
      pricing:
        effectiveAt: "2026-11-03"
        checkedAt: "2026-11-03"
        source: https://docs.fireworks.ai/serverless/pricing
        inputMicrosPerMillion: 150000
        cachedInputMicrosPerMillion: 15000
        outputMicrosPerMillion: 600000
        # Reserve the full context as the output ceiling when no cap is supplied.
        # Model context: https://fireworks.ai/models/fireworks/gpt-oss-120b
        maxInputTokens: 131072
        defaultMaxOutputTokens: 131072
        serviceTiers:
          - id: default
            inputMicrosPerMillion: 150000
            cachedInputMicrosPerMillion: 15000
            outputMicrosPerMillion: 600000
          - id: priority
            inputMicrosPerMillion: 180000
            cachedInputMicrosPerMillion: 18000
            outputMicrosPerMillion: 720000
    - id: fireworks/glm-5.3-fast
      upstream: accounts/fireworks/routers/glm-5p3-fast
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            checkedAt: "2026-11-03"
            sources:
              - https://app.fireworks.ai/models/fireworks/glm-5p3
              - https://docs.fireworks.ai/serverless/serverless-modes
            input: [text]
            contextWindow: 1048576
      requestParameters:
        chat_completions:
          checkedAt: "2026-11-03"
          sources:
            - https://app.fireworks.ai/models/fireworks/glm-5p3
          toolCalling: supported
      pricingRef: fireworks-glm-5p3-fast-2026-11-03
      pricing:
        effectiveAt: "2026-11-03"
        checkedAt: "2026-11-03"
        source: https://docs.fireworks.ai/serverless/pricing
        inputMicrosPerMillion: 2100000
        cachedInputMicrosPerMillion: 390000
        outputMicrosPerMillion: 6600000
        # Full-context reservation ceiling, not a claimed output maximum/default.
        maxInputTokens: 1048576
        defaultMaxOutputTokens: 1048576
        serviceTiers:
          - id: default
            # Fireworks treats these API enum values as default, not paid upgrades.
            aliases: [auto, flex]
            inputMicrosPerMillion: 2100000
            cachedInputMicrosPerMillion: 390000
            outputMicrosPerMillion: 6600000
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
