# Standard API only; region and plan contracts: docs/hosted-platform-providers.md.
# Endpoint/model source checked 2026-11-03: https://ai.baidu.com/ai-doc/WENXINWORKSHOP/4mchtzl8s
schema: clawrouter.service-provider.v1
id: qianfan
displayName: Baidu Qianfan v2
status: experimental
class: openai_compatible
service:
  platform: qianfan
  kind: model_provider
  upstreamService: qianfan
  configKeys: [QIANFAN_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://qianfan.baidubce.com/v2
routing:
  nativePrefixes: [clawrouter-qianfan, qianfan]
  modelPrefixes: [qianfan/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: qianfan/ernie-4.5-0.3b
      displayName: "ERNIE 4.5 0.3B"
      upstream: ernie-4.5-0.3b
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
