schema: clawrouter.service-provider.v1
id: levanto
displayName: Levanto Sage
status: experimental
class: custom_adapter
service:
  platform: levanto
  kind: model_provider
  upstreamService: levanto
  configKeys: [SAGE_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://sage.levanto.ai
routing:
  nativePrefixes: [clawrouter-levanto, levanto]
  modelPrefixes: [levanto/]
adapter:
  request: sage
  response: sage
  error: json_error
capabilities:
  - id: llm.decisions
    endpoint: decisions
    methods: [POST]
  - id: llm.decisions.batch
    endpoint: decisions_batch
    methods: [POST]
endpoints:
  decisions:
    path: /decide
    requestFormat: sage.decide
    responseFormat: sage.decide
    timeoutMs: 120000
  decisions_batch:
    path: /decide/batch
    requestFormat: sage.decide_batch
    responseFormat: sage.decide_batch
    timeoutMs: 120000
models:
  entries:
    - id: levanto/levanto-sage-2
      upstream: levanto-sage-2
      capabilities: [llm.decisions, llm.decisions.batch]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
  counters:
    - name: input_tokens
      source: meta.usage.input_tokens
      unit: token
    - name: output_tokens
      source: meta.usage.output_tokens
      unit: token
