# API-key subset; remaining contracts: docs/cloud-key-providers.md.
# Endpoint/model source checked 2026-11-03: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/hugging-face-models
schema: clawrouter.service-provider.v1
id: microsoft-foundry
displayName: Microsoft Foundry API key
status: experimental
class: openai_compatible
service:
  platform: microsoft-foundry
  kind: model_provider
  upstreamService: microsoft-foundry
  configKeys: [MICROSOFT_FOUNDRY_API_KEY, MICROSOFT_FOUNDRY_ENDPOINT, MICROSOFT_FOUNDRY_DEPLOYMENT]
auth:
  schemes:
    - type: api_key
      header: api-key
      secretKind: api_key
baseUrls:
  default: ${endpoint}
routing:
  nativePrefixes: [clawrouter-microsoft-foundry, microsoft-foundry]
  modelPrefixes: [microsoft-foundry/]
  baseUrlParam: endpoint
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /openai/v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: microsoft-foundry/deployment
      upstream: ${deployment}
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
