# Gateway Chat and native Messages: docs/hosted-gateway-providers.md.
# Endpoint/model source checked 2026-11-03: https://vercel.com/docs/ai-gateway/sdks-and-apis
schema: clawrouter.service-provider.v1
id: vercel-ai-gateway
displayName: Vercel AI Gateway
status: experimental
class: openai_compatible
service:
  platform: vercel-ai-gateway
  kind: gateway_platform
  upstreamService: vercel-ai-gateway
  configKeys: [AI_GATEWAY_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://ai-gateway.vercel.sh/v1
routing:
  nativePrefixes: [clawrouter-vercel-ai-gateway, vercel-ai-gateway]
  modelPrefixes: [vercel-ai-gateway/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: llm.messages
    endpoint: messages
    methods: [POST]
  - id: models.list
    endpoint: models_list
    methods: [GET]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  messages:
    modelPassthrough: {}
    path: /v1/messages
    upstreamPath: /messages
    requestHeaders: [anthropic-beta, anthropic-version]
    requestFormat: anthropic.messages
    responseFormat: anthropic.messages
    streaming: sse
    timeoutMs: 600000
  models_list:
    path: /models
    method: GET
    requestFormat: openai.models
    responseFormat: openai.models
models:
  entries:
    - id: vercel-ai-gateway/anthropic/claude-sonnet-4.6
      displayName: "Claude Sonnet 4.6"
      upstream: anthropic/claude-sonnet-4.6
      capabilities: [llm.chat, llm.messages]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
