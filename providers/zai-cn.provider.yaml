# Frozen endpoint variants and model dispositions: docs/zai-regional-contracts.md.
# Primary endpoint checked 2026-11-03; no standard API or cross-region key fallback.
schema: clawrouter.service-provider.v1
id: zai-cn
displayName: Z.AI (China standard API)
status: experimental
class: openai_compatible
service:
  platform: zai
  kind: model_provider
  upstreamService: zai-cn
  configKeys: [ZAI_CN_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://open.bigmodel.cn/api/paas/v4
routing:
  nativePrefixes: [clawrouter-zai-cn, zai-cn]
  modelPrefixes: [zai-cn/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: zai-cn/glm-5.3
      upstream: glm-5.3
      capabilities: [llm.chat]
    - id: zai-cn/glm-5.3-flash
      upstream: glm-5.3-flash
      capabilities: [llm.chat]
    - id: zai-cn/glm-5.2
      upstream: glm-5.2
      capabilities: [llm.chat]
    - id: zai-cn/glm-5-turbo
      upstream: glm-5-turbo
      capabilities: [llm.chat]
    - id: zai-cn/glm-5v-turbo
      upstream: glm-5v-turbo
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
