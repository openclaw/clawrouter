schema: clawrouter.service-provider.v1
id: groq
displayName: Groq
status: stable
class: openai_compatible
service:
  platform: groq
  kind: model_provider
  upstreamService: groq
  configKeys: [GROQ_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.groq.com/openai
routing:
  nativePrefixes: [clawrouter-groq, groq]
  modelPrefixes: [groq/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: audio.transcription
    endpoint: transcription
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  transcription:
    path: /v1/audio/transcriptions
    pathParams: []
    method: POST
    requestFormat: groq.transcription
    responseFormat: groq.transcription
    nativeProxy: true
    headers:
      Accept: application/json
models:
  entries:
    - id: groq/gpt-oss-120b
      displayName: "GPT-OSS 120B"
      upstream: openai/gpt-oss-120b
      capabilities: [llm.chat]
      supportedReasoningEfforts: [low, medium, high]
      requestParameters:
        chat_completions:
          sources:
            - https://console.groq.com/docs/openai
            - https://console.groq.com/docs/reasoning
          checkedAt: "2026-09-23"
          logprobs: unsupported
      pricingRef: groq-gpt-oss-120b-standard-2026-06-22
      pricing:
        effectiveAt: "2026-06-22"
        source: https://console.groq.com/docs/model/openai/gpt-oss-120b
        inputMicrosPerMillion: 150000
        cachedInputMicrosPerMillion: 75000
        outputMicrosPerMillion: 600000
        maxInputTokens: 131072
        defaultMaxOutputTokens: 65536
        autoServiceTier: unpriced
        serviceTiers:
          - id: default
            aliases: [on_demand]
            inputMicrosPerMillion: 150000
            cachedInputMicrosPerMillion: 75000
            outputMicrosPerMillion: 600000
          - id: flex
            inputMicrosPerMillion: 150000
            cachedInputMicrosPerMillion: 75000
            outputMicrosPerMillion: 600000
    - id: groq/gpt-oss-20b
      displayName: "GPT-OSS 20B"
      upstream: openai/gpt-oss-20b
      capabilities: [llm.chat]
      supportedReasoningEfforts: [low, medium, high]
      requestParameters:
        chat_completions:
          sources:
            - https://console.groq.com/docs/model/openai/gpt-oss-20b
            - https://console.groq.com/docs/openai
            - https://console.groq.com/docs/reasoning
          checkedAt: "2026-11-03"
          logprobs: unsupported
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://console.groq.com/docs/model/openai/gpt-oss-20b
            checkedAt: "2026-11-03"
            input: [text]
            contextWindow: 131072
            maxOutputTokens: 65536
      pricingRef: groq-gpt-oss-20b-token-upper-bound-2026-11-03
      pricing:
        effectiveAt: "2026-11-03"
        source: https://console.groq.com/docs/model/openai/gpt-oss-20b
        settlementBasis: published_upper_bound
        # The model page rounds cache pricing to $0.037; the documented 50%
        # discount gives $0.0375. Keep the higher value until reconciled.
        # https://console.groq.com/docs/prompt-caching
        inputMicrosPerMillion: 75000
        cachedInputMicrosPerMillion: 37500
        outputMicrosPerMillion: 300000
        maxInputTokens: 131072
        defaultMaxOutputTokens: 65536
        # Auto can select enterprise capacity, whose contract is not token-priced.
        # https://console.groq.com/docs/service-tiers
        autoServiceTier: unpriced
        serviceTiers:
          - id: default
            aliases: [on_demand]
            inputMicrosPerMillion: 75000
            cachedInputMicrosPerMillion: 37500
            outputMicrosPerMillion: 300000
          - id: flex
            # https://console.groq.com/docs/flex-processing
            inputMicrosPerMillion: 75000
            cachedInputMicrosPerMillion: 37500
            outputMicrosPerMillion: 300000
    - id: groq/gpt-oss-safeguard-20b
      displayName: "GPT-OSS Safeguard 20B"
      upstream: openai/gpt-oss-safeguard-20b
      capabilities: [llm.chat]
      supportedReasoningEfforts: [low, medium, high]
      requestParameters:
        chat_completions:
          sources:
            - https://console.groq.com/docs/model/openai/gpt-oss-safeguard-20b
            - https://console.groq.com/docs/openai
            - https://console.groq.com/docs/reasoning
          checkedAt: "2026-11-03"
          logprobs: unsupported
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://console.groq.com/docs/model/openai/gpt-oss-safeguard-20b
            checkedAt: "2026-11-03"
            input: [text]
            contextWindow: 131072
            maxOutputTokens: 65536
      pricingRef: groq-gpt-oss-safeguard-20b-token-upper-bound-2026-11-03
      pricing:
        effectiveAt: "2026-11-03"
        source: https://console.groq.com/docs/model/openai/gpt-oss-safeguard-20b
        settlementBasis: published_upper_bound
        # The model page rounds cache pricing to $0.037; the documented 50%
        # discount gives $0.0375. Keep the higher value until reconciled.
        # https://console.groq.com/docs/prompt-caching
        inputMicrosPerMillion: 75000
        cachedInputMicrosPerMillion: 37500
        outputMicrosPerMillion: 300000
        maxInputTokens: 131072
        defaultMaxOutputTokens: 65536
        # Auto can select enterprise capacity, whose contract is not token-priced.
        # https://console.groq.com/docs/service-tiers
        autoServiceTier: unpriced
        serviceTiers:
          - id: default
            aliases: [on_demand]
            inputMicrosPerMillion: 75000
            cachedInputMicrosPerMillion: 37500
            outputMicrosPerMillion: 300000
          - id: flex
            # https://console.groq.com/docs/flex-processing
            inputMicrosPerMillion: 75000
            cachedInputMicrosPerMillion: 37500
            outputMicrosPerMillion: 300000
    # No qualified whole-upload price bound; do not borrow Chat token rates.
    - id: groq/whisper-large-v3-turbo
      upstream: whisper-large-v3-turbo
      capabilities: [audio.transcription]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          transcription:
            sources:
              - https://console.groq.com/docs/speech-to-text
            checkedAt: "2026-11-03"
            input: [audio]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
