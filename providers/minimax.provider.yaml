schema: clawrouter.service-provider.v1
id: minimax
displayName: MiniMax
status: stable
class: openai_compatible
service:
  platform: minimax
  kind: model_provider
  upstreamService: minimax
  configKeys: [MINIMAX_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.minimax.io
routing:
  nativePrefixes: [clawrouter-minimax, minimax]
  modelPrefixes: [minimax/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: minimax/MiniMax-M3.1-Flash
      upstream: MiniMax-M3.1-Flash
      capabilities: [llm.chat]
      supportedReasoningEfforts: [low, medium, high, xhigh, max]
      requestParameters:
        chat_completions:
          sources:
            - https://platform.minimax.io/docs/api-reference/text-openai-api
          checkedAt: "2026-11-03"
          defaultReasoningEffort: max
          temperature: unsupported
          topP: unsupported
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://platform.minimax.io/docs/api-reference/text-openai-api
            checkedAt: "2026-11-03"
            input: [text, image, video]
            contextWindow: 1000000
      pricingRef: minimax-m3-1-flash-standard-2026-11-03
      pricing:
        effectiveAt: "2026-11-03"
        source: https://platform.minimax.io/docs/pricing/overview
        inputMicrosPerMillion: 150000
        cachedInputMicrosPerMillion: 15000
        outputMicrosPerMillion: 600000
        maxInputTokens: 1000000
        # Full context is a conservative reservation ceiling, not a documented
        # default output limit. Explicit max_completion_tokens includes thinking.
        defaultMaxOutputTokens: 1000000
        # M3.1-Flash does not support service_tier; do not inherit M3's tiers.
    - id: minimax/MiniMax-M2.7
      upstream: MiniMax-M2.7
      capabilities: [llm.chat]
      pricingRef: minimax-m2-7-standard-2026-06-22
      pricing:
        effectiveAt: "2026-06-22"
        source: https://platform.minimax.io/docs/guides/pricing-paygo
        inputMicrosPerMillion: 300000
        cachedInputMicrosPerMillion: 60000
        outputMicrosPerMillion: 1200000
        maxInputTokens: 204800
        defaultMaxOutputTokens: 131072
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
  counters:
    - name: input_tokens
      source: usage.prompt_tokens
      unit: token
    - name: output_tokens
      source: usage.completion_tokens
      unit: token
