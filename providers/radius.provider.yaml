# Native Pi wire contract: docs/radius-native-transport.md.
schema: clawrouter.service-provider.v1
id: radius
displayName: Radius Pi gateway
status: experimental
class: custom_adapter
service:
  platform: radius
  kind: gateway_platform
  upstreamService: radius
  configKeys: [RADIUS_API_KEY, RADIUS_MODEL]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://radius.pi.dev/v1
routing:
  nativePrefixes: [clawrouter-radius, radius]
  modelPrefixes: [radius/]
adapter:
  request: radius
  response: radius
  stream: radius_sse
  error: json_error
capabilities:
  - { id: llm.chat, endpoint: messages, methods: [POST] }
  - { id: models.list, endpoint: config, methods: [GET] }
endpoints:
  config:
    method: GET
    path: /config
    requestFormat: radius.config
    responseFormat: radius.config
    timeoutMs: 30000
  messages:
    path: /messages
    requestFormat: radius.messages
    responseFormat: radius.messages
    streaming: sse
    timeoutMs: 600000
    modelPassthrough: {}
models:
  entries:
    - id: radius/configured
      upstream: ${model}
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
