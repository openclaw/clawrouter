# Hosted Chat API only; product boundaries: docs/hosted-catalog-providers.md.
# Endpoint/model source checked 2026-11-03: https://featherless.ai/docs/completions
schema: clawrouter.service-provider.v1
id: featherless
displayName: Featherless
status: experimental
class: openai_compatible
service:
  platform: featherless
  kind: model_provider
  upstreamService: featherless
  configKeys: [FEATHERLESS_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.featherless.ai/v1
routing:
  nativePrefixes: [clawrouter-featherless, featherless]
  modelPrefixes: [featherless/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: featherless/GalrionSoftworks/Margnum-12B-v1
      upstream: GalrionSoftworks/Margnum-12B-v1
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
