# Chat API only; qualification: docs/hosted-specialist-providers.md.
# Endpoint/model source checked 2026-11-03: https://dev.synthetic.new/docs/api/overview
schema: clawrouter.service-provider.v1
id: synthetic
displayName: Synthetic
status: experimental
class: openai_compatible
service:
  platform: synthetic
  kind: model_provider
  upstreamService: synthetic
  configKeys: [SYNTHETIC_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.synthetic.new/openai/v1
routing:
  nativePrefixes: [clawrouter-synthetic, synthetic]
  modelPrefixes: [synthetic/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: synthetic/syn:large:text
      upstream: syn:large:text
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
