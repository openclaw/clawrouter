            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 262144
            maxOutputTokens: 65535
    - id: chutes/zai-org/GLM-5.2-TEE
      upstream: zai-org/GLM-5.2-TEE
      capabilities: [llm.chat]
      requestParameters:
        chat_completions:
          sources: [https://llm.chutes.ai/v1/models, https://chutes.ai/docs/models/chutes-zai-org-glm-5-2-tee]
