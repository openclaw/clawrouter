# Gateway Chat contract: docs/hosted-gateway-providers.md.
# Endpoint/model source checked 2026-11-03: https://kilo.ai/docs/gateway/models-and-providers
schema: clawrouter.service-provider.v1
id: kilocode
displayName: Kilo AI Gateway
status: experimental
class: openai_compatible
service:
  platform: kilocode
  kind: gateway_platform
  upstreamService: kilocode
  configKeys: [KILOCODE_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://ai-gateway.kilo.ai/api/v1
routing:
  nativePrefixes: [clawrouter-kilocode, kilocode]
  modelPrefixes: [kilocode/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: kilocode/anthropic/claude-sonnet-4.6
      displayName: "Claude Sonnet 4.6"
      upstream: anthropic/claude-sonnet-4.6
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
