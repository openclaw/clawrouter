# Chat API only; qualification: docs/hosted-specialist-providers.md.
# Endpoint/model source checked 2026-11-03: https://dev.meta.ai/docs/cookbook/quickstart-chat-completions
schema: clawrouter.service-provider.v1
id: meta
displayName: Meta Model API
status: experimental
class: openai_compatible
service:
  platform: meta
  kind: model_provider
  upstreamService: meta
  configKeys: [MODEL_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.meta.ai/v1
routing:
  nativePrefixes: [clawrouter-meta, meta]
  modelPrefixes: [meta/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - { id: llm.responses, endpoint: responses, methods: [POST] }
  - { id: models.list, endpoint: models_list, methods: [GET] }
  - { id: models.retrieve, endpoint: models_retrieve, methods: [GET] }
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  responses:
    modelPassthrough: {}
    path: /responses
    requestFormat: openai.responses
    responseFormat: openai.responses
    streaming: sse
    responsesLifecycle: { retrieve: responses_retrieve, cancel: responses_cancel }
    timeoutMs: 600000
  responses_retrieve:
    method: GET
    path: /responses/${response_id}
    pathParams: [response_id]
    requestFormat: openai.responses
    responseFormat: openai.responses
    streaming: sse
    timeoutMs: 600000
  responses_cancel:
    method: POST
    path: /responses/${response_id}/cancel
    pathParams: [response_id]
    requestFormat: openai.responses
    responseFormat: openai.responses
    timeoutMs: 600000
  models_list:
    method: GET
    path: /models
    requestFormat: openai.models
    responseFormat: openai.models
    timeoutMs: 30000
  models_retrieve:
    method: GET
    path: /models/${model_id}
    pathParams: [model_id]
    pathParamStyles: { model_id: opaque_segment }
    requestFormat: openai.models
    responseFormat: openai.models
    timeoutMs: 30000
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: meta/muse-spark-1.3
      displayName: "Muse Spark 1.3"
      upstream: muse-spark-1.3
      capabilities: [llm.chat, llm.responses]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          responses:
            sources: [https://dev.meta.ai/docs/models, https://dev.meta.ai/docs/protocols/responses]
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 1048576
    - id: meta/muse-wonder-1.0
      displayName: "Muse Wonder 1.0"
      upstream: muse-wonder-1.0
      capabilities: [llm.chat, llm.responses]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          responses:
            sources: [https://dev.meta.ai/docs/models, https://dev.meta.ai/docs/protocols/responses]
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 1048576
    - id: meta/muse-spark-1.3-contributor
      displayName: "Muse Spark 1.3 Contributor"
      upstream: muse-spark-1.3-contributor
      capabilities: [llm.chat, llm.responses]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          responses:
            sources: [https://dev.meta.ai/docs/models, https://dev.meta.ai/docs/protocols/responses]
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 1048576
    - id: meta/muse-spark-1.2
      displayName: "Muse Spark 1.2"
      upstream: muse-spark-1.2
      capabilities: [llm.chat, llm.responses]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          responses:
            sources: [https://dev.meta.ai/docs/models, https://dev.meta.ai/docs/protocols/responses]
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 1048576
    - id: meta/muse-spark-1.2-contributor
      displayName: "Muse Spark 1.2 Contributor"
      upstream: muse-spark-1.2-contributor
      capabilities: [llm.chat, llm.responses]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          responses:
            sources: [https://dev.meta.ai/docs/models, https://dev.meta.ai/docs/protocols/responses]
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 1048576
    - id: meta/muse-spark-1.1
      displayName: "Muse Spark 1.1"
      upstream: muse-spark-1.1
      capabilities: [llm.chat, llm.responses]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          responses:
            sources: [https://dev.meta.ai/docs/models, https://dev.meta.ai/docs/protocols/responses]
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 1048576
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
