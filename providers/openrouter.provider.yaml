schema: clawrouter.service-provider.v1
id: openrouter
displayName: OpenRouter
status: stable
class: openai_compatible
service:
  platform: openrouter
  kind: gateway_platform
  upstreamService: openrouter
  configKeys: [OPENROUTER_API_KEY, OPENROUTER_SITE_URL]
  optionalConfigKeys: [OPENROUTER_SITE_URL]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://openrouter.ai/api
routing:
  nativePrefixes: [clawrouter-openrouter, openrouter]
  modelPrefixes: [openrouter/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
  injectHeaders:
    HTTP-Referer: ${site_url}
    X-Title: ClawRouter
capabilities:
  - id: llm.responses
    endpoint: responses
    methods: [POST]
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: audio.speech
    endpoint: speech
    methods: [POST]
endpoints:
  responses:
    modelPassthrough: {}
    path: /v1/responses
    requestFormat: openai.responses
    responseFormat: openai.responses
    streaming: sse
    timeoutMs: 600000
  chat_completions:
    modelPassthrough: {}
    path: /v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  speech:
    path: /v1/audio/speech
    method: POST
    requestFormat: openai.audio_speech
    responseFormat: audio.binary
    nativeProxy: true
    timeoutMs: 120000
models:
  entries:
    - id: openrouter/auto
      upstream: openrouter/auto
      capabilities: [llm.chat]
      pricingRef: openrouter-auto
    # MP3 speech tariffs remain unknown; do not attach Chat token pricing.
    - id: openrouter/hexgrad/kokoro-82m
      upstream: hexgrad/kokoro-82m
      capabilities: [audio.speech]
    - id: openrouter/elevenlabs/eleven-turbo-v2
      upstream: elevenlabs/eleven-turbo-v2
      capabilities: [audio.speech]
    - id: openrouter/mistralai/voxtral-mini-tts-2603
      upstream: mistralai/voxtral-mini-tts-2603
      capabilities: [audio.speech]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
  counters:
    - name: input_tokens
      source: usage.prompt_tokens
      unit: token
    - name: output_tokens
      source: usage.completion_tokens
      unit: token
