schema: clawrouter.service-provider.v1
id: openrouter
displayName: OpenRouter
status: stable
class: openai_compatible
service:
  platform: openrouter
  kind: gateway_platform
  upstreamService: openrouter
  configKeys: [OPENROUTER_API_KEY, OPENROUTER_SITE_URL]
  optionalConfigKeys: [OPENROUTER_SITE_URL]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://openrouter.ai/api
routing:
  nativePrefixes: [clawrouter-openrouter, openrouter]
  modelPrefixes: [openrouter/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
  injectHeaders:
    HTTP-Referer: ${site_url}
    X-Title: ClawRouter
capabilities:
  - id: llm.responses
    endpoint: responses
    methods: [POST]
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  responses:
    modelPassthrough: {}
    path: /v1/responses
    requestFormat: openai.responses
    responseFormat: openai.responses
    streaming: sse
    timeoutMs: 600000
  chat_completions:
    modelPassthrough: {}
    path: /v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: openrouter/auto
      upstream: openrouter/auto
      capabilities: [llm.chat]
      pricingRef: openrouter-auto
    - id: openrouter/openai/gpt-6.1-terra
      upstream: openai/gpt-6.1-terra
      capabilities: [llm.responses, llm.chat]
      supportedReasoningEfforts: [none, low, medium, high, xhigh, max]
      requestParameters:
        responses:
          sources:
            - https://openrouter.ai/api/v1/models
            - https://openrouter.ai/docs/api_reference/responses/overview
          checkedAt: "2026-11-03"
          defaultReasoningEffort: medium
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          responses: &terraCapabilities
            sources:
              - https://openrouter.ai/api/v1/models
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 1050000
            maxOutputTokens: 128000
          chat_completions: *terraCapabilities
      # The live catalog advertises the endpoint, but routing/plugin fees and
      # actual billed usage still need qualification. Do not inherit direct rates.
      pricingRef: openrouter-gpt-6-1-terra-unqualified-2026-11-03
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
  counters:
    - name: input_tokens
      source: usage.prompt_tokens
      unit: token
    - name: output_tokens
      source: usage.completion_tokens
      unit: token
