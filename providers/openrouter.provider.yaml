schema: clawrouter.service-provider.v1
id: openrouter
displayName: OpenRouter
status: stable
class: openai_compatible
service:
  platform: openrouter
  kind: gateway_platform
  upstreamService: openrouter
  configKeys: [OPENROUTER_API_KEY, OPENROUTER_SITE_URL]
  optionalConfigKeys: [OPENROUTER_SITE_URL]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://openrouter.ai/api
routing:
  nativePrefixes: [clawrouter-openrouter, openrouter]
  modelPrefixes: [openrouter/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
  injectHeaders:
    HTTP-Referer: ${site_url}
    X-Title: ClawRouter
capabilities:
  - id: llm.responses
    endpoint: responses
    methods: [POST]
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: music.generate
    endpoint: music_generate
    methods: [POST]
endpoints:
  responses:
    modelPassthrough: {}
    path: /v1/responses
    requestFormat: openai.responses
    responseFormat: openai.responses
    streaming: sse
    timeoutMs: 600000
  chat_completions:
    modelPassthrough: {}
    path: /v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  music_generate:
    path: /v1/chat/completions
    method: POST
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: openrouter/auto
      upstream: openrouter/auto
      capabilities: [llm.chat]
      pricingRef: openrouter-auto
    - id: openrouter/google/lyria-3-pro-preview
      upstream: google/lyria-3-pro-preview
      capabilities: [music.generate]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          music_generate:
            sources:
              - https://github.com/openclaw/clawrouter/blob/b8b33d5bdd771bfa0904ac493b2fc6129b2768db/docs/openrouter-music-runtime.md
              - https://openrouter.ai/google/lyria-3-pro-preview
            checkedAt: "2026-11-04"
            input: [text]
    - id: openrouter/google/lyria-3-clip-preview
      upstream: google/lyria-3-clip-preview
      capabilities: [music.generate]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          music_generate:
            sources:
              - https://github.com/openclaw/clawrouter/blob/b8b33d5bdd771bfa0904ac493b2fc6129b2768db/docs/openrouter-music-runtime.md
              - https://openrouter.ai/google/lyria-3-clip-preview
            checkedAt: "2026-11-04"
            input: [text]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
  counters:
    - name: input_tokens
      source: usage.prompt_tokens
      unit: token
    - name: output_tokens
      source: usage.completion_tokens
      unit: token
