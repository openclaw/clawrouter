schema: clawrouter.service-provider.v1
id: openrouter
displayName: OpenRouter
status: stable
class: openai_compatible
service:
  platform: openrouter
  kind: gateway_platform
  upstreamService: openrouter
  configKeys: [OPENROUTER_API_KEY, OPENROUTER_SITE_URL]
  optionalConfigKeys: [OPENROUTER_SITE_URL]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://openrouter.ai/api
routing:
  nativePrefixes: [clawrouter-openrouter, openrouter]
  modelPrefixes: [openrouter/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
  injectHeaders:
    HTTP-Referer: ${site_url}
    X-Title: ClawRouter
capabilities:
  - id: llm.responses
    endpoint: responses
    methods: [POST]
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: audio.transcription
    endpoint: transcription
    methods: [POST]
endpoints:
  responses:
    modelPassthrough: {}
    path: /v1/responses
    requestFormat: openai.responses
    responseFormat: openai.responses
    streaming: sse
    timeoutMs: 600000
  chat_completions:
    modelPassthrough: {}
    path: /v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  transcription:
    method: POST
    path: /v1/audio/transcriptions
    requestFormat: openrouter.audio_transcription
    responseFormat: openrouter.audio_transcription
models:
  entries:
    - id: openrouter/auto
      upstream: openrouter/auto
      capabilities: [llm.chat]
      pricingRef: openrouter-auto
    - id: openrouter/openai/whisper-large-v3-turbo
      upstream: openai/whisper-large-v3-turbo
      capabilities: [audio.transcription]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          transcription:
            sources:
              - https://openrouter.ai/docs/guides/overview/multimodal/stt
              - https://openrouter.ai/openai/whisper-large-v3-turbo
            checkedAt: "2026-11-04"
            input: [audio]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
  counters:
    - name: input_tokens
      source: usage.prompt_tokens
      unit: token
    - name: output_tokens
      source: usage.completion_tokens
      unit: token
