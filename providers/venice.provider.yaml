# Hosted Chat and public model metadata; product boundaries: docs/hosted-catalog-providers.md.
# Endpoint/model source checked 2026-11-03: https://docs.venice.ai/overview/about-venice
# Catalog exposure and authority: docs/public-catalog-declarations.md.
schema: clawrouter.service-provider.v1
id: venice
displayName: Venice API
status: experimental
class: openai_compatible
service:
  platform: venice
  kind: model_provider
  upstreamService: venice
  configKeys: [VENICE_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.venice.ai/api/v1
routing:
  nativePrefixes: [clawrouter-venice, venice]
  modelPrefixes: [venice/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: models.list
    endpoint: models_list
    methods: [GET]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  models_list:
    method: GET
    path: /models
    nativeProxy: true
    requestFormat: venice.models
    responseFormat: venice.models
    headers:
      accept: application/json
    timeoutMs: 10000
models:
  entries:
    - id: venice/zai-org-glm-5-2
      upstream: zai-org-glm-5-2
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
