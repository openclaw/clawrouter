      requestParameters:
        chat_completions:
          sources: [https://api.venice.ai/api/v1/models?type=text, https://docs.venice.ai/guides/features/reasoning-models]
          checkedAt: "2026-11-03"
          toolCalling: supported
          defaultReasoningEffort: max
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
