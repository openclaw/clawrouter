schema: clawrouter.service-provider.v1
id: google-gemini
displayName: Google Gemini
status: stable
class: rest_json
service:
  platform: google
  kind: model_provider
  upstreamService: gemini
  configKeys: [GOOGLE_API_KEY]
auth:
  schemes:
    - type: api_key
      header: x-goog-api-key
      secretKind: api_key
baseUrls:
  default: https://generativelanguage.googleapis.com
routing:
  nativePrefixes: [clawrouter-google, google, gemini]
  modelPrefixes: [google/, gemini/]
adapter:
  request: google_gemini
  response: google_gemini
  stream: google_sse
  error: google_error
capabilities:
  - id: llm.generate
    endpoint: generate_content
    methods: [POST]
  - id: llm.stream
    endpoint: stream_generate_content
    methods: [POST]
endpoints:
  generate_content:
    modelPassthrough: {}
    path: /v1beta/models/${model}:generateContent
    pathParams: [model]
    requestFormat: google.generate_content
    responseFormat: google.generate_content
    timeoutMs: 600000
  stream_generate_content:
    modelPassthrough: {}
    path: /v1beta/models/${model}:streamGenerateContent
    pathParams: [model]
    query: { alt: sse }
    requestFormat: google.generate_content
    responseFormat: google.stream_generate_content
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: google/gemini-3.5-flash
      upstream: gemini-3.5-flash
      capabilities: [llm.generate, llm.stream]
      pricingRef: google-gemini-3-5-flash-tiers-2026-09-23
      pricing:
        effectiveAt: "2026-09-23"
        source: https://ai.google.dev/gemini-api/docs/pricing#gemini-3.5-flash
        inputMicrosPerMillion: 1500000
        cachedInputMicrosPerMillion: 150000
        outputMicrosPerMillion: 9000000
        maxInputTokens: 1048576
        defaultMaxOutputTokens: 65536
        serviceTiers:
          - id: default
            aliases: [standard]
            inputMicrosPerMillion: 1500000
            cachedInputMicrosPerMillion: 150000
            outputMicrosPerMillion: 9000000
          - id: flex
            inputMicrosPerMillion: 750000
            cachedInputMicrosPerMillion: 80000
            outputMicrosPerMillion: 4500000
          - id: priority
            inputMicrosPerMillion: 2700000
            cachedInputMicrosPerMillion: 270000
