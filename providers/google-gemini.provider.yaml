schema: clawrouter.service-provider.v1
id: google-gemini
displayName: Google Gemini
status: stable
class: rest_json
service:
  platform: google
  kind: model_provider
  upstreamService: gemini
  configKeys: [GOOGLE_API_KEY]
auth:
  schemes:
    - type: api_key
      header: x-goog-api-key
      secretKind: api_key
baseUrls:
  default: https://generativelanguage.googleapis.com
routing:
  nativePrefixes: [clawrouter-google, google, gemini]
  modelPrefixes: [google/, gemini/]
adapter:
  request: google_gemini
  response: google_gemini
  stream: google_sse
  error: google_error
capabilities:
  - id: llm.generate
    endpoint: generate_content
    methods: [POST]
  - id: llm.stream
    endpoint: stream_generate_content
    methods: [POST]
  - id: llm.embeddings
    endpoint: embed_content
    methods: [POST]
  - id: llm.embeddings
    endpoint: batch_embed_contents
    methods: [POST]
endpoints:
  generate_content:
    modelPassthrough: {}
    path: /v1beta/models/${model}:generateContent
    pathParams: [model]
    requestFormat: google.generate_content
    responseFormat: google.generate_content
    timeoutMs: 600000
  stream_generate_content:
    modelPassthrough: {}
    path: /v1beta/models/${model}:streamGenerateContent
    pathParams: [model]
    query: { alt: sse }
    requestFormat: google.generate_content
    responseFormat: google.stream_generate_content
    streaming: sse
    timeoutMs: 600000
  embed_content:
    path: /v1beta/models/${model}:embedContent
    pathParams: [model]
    requestFormat: google.embed_content
    responseFormat: google.embed_content
    timeoutMs: 60000
  batch_embed_contents:
    path: /v1beta/models/${model}:batchEmbedContents
    pathParams: [model]
    requestFormat: google.batch_embed_contents
    responseFormat: google.batch_embed_contents
    timeoutMs: 60000
models:
  entries:
    - id: google/gemini-3.5-flash
      upstream: gemini-3.5-flash
      capabilities: [llm.generate, llm.stream]
      pricingRef: google-gemini-3-5-flash-tiers-2026-09-23
      pricing:
        effectiveAt: "2026-09-23"
        source: https://ai.google.dev/gemini-api/docs/pricing#gemini-3.5-flash
        inputMicrosPerMillion: 1500000
        cachedInputMicrosPerMillion: 150000
        outputMicrosPerMillion: 9000000
        maxInputTokens: 1048576
        defaultMaxOutputTokens: 65536
        serviceTiers:
          - id: default
            aliases: [standard]
            inputMicrosPerMillion: 1500000
            cachedInputMicrosPerMillion: 150000
            outputMicrosPerMillion: 9000000
          - id: flex
            inputMicrosPerMillion: 750000
            cachedInputMicrosPerMillion: 80000
            outputMicrosPerMillion: 4500000
          - id: priority
            inputMicrosPerMillion: 2700000
            cachedInputMicrosPerMillion: 270000
            outputMicrosPerMillion: 16200000
    - id: google/gemini-embedding-001
      upstream: gemini-embedding-001
      capabilities: [llm.embeddings]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          embed_content: &embedding001Facts
            checkedAt: "2026-11-03"
            sources:
              - https://ai.google.dev/gemini-api/docs/embeddings
              - https://ai.google.dev/gemini-api/docs/deprecations
            contextWindow: 2048
            input: [text]
          batch_embed_contents: *embedding001Facts
    - id: google/gemini-embedding-2
      upstream: gemini-embedding-2
      capabilities: [llm.embeddings]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          embed_content: &embedding2Facts
            checkedAt: "2026-11-03"
            sources:
              - https://ai.google.dev/gemini-api/docs/embeddings
              - https://ai.google.dev/gemini-api/docs/deprecations
            contextWindow: 8192
          batch_embed_contents: *embedding2Facts
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
