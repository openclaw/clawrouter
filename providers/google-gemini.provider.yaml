schema: clawrouter.service-provider.v1
id: google-gemini
displayName: Google Gemini
status: stable
class: rest_json
service:
  platform: google
  kind: model_provider
  upstreamService: gemini
  configKeys: [GOOGLE_API_KEY]
auth:
  schemes:
    - type: api_key
      header: x-goog-api-key
      secretKind: api_key
baseUrls:
  default: https://generativelanguage.googleapis.com
routing:
  nativePrefixes: [clawrouter-google, google, gemini]
  modelPrefixes: [google/, gemini/]
adapter:
  request: google_gemini
  response: google_gemini
  stream: google_sse
  error: google_error
capabilities:
  - id: llm.generate
    endpoint: generate_content
    methods: [POST]
  - id: llm.stream
    endpoint: stream_generate_content
    methods: [POST]
  - id: llm.embeddings
    endpoint: embed_content
    methods: [POST]
  - id: llm.embeddings
    endpoint: batch_embed_contents
    methods: [POST]
  - id: audio.speech
    endpoint: speech_generate_content
    methods: [POST]
  - id: audio.speech
    endpoint: speech_interactions
    methods: [POST]
endpoints:
  generate_content:
    modelPassthrough: {}
    path: /v1beta/models/${model}:generateContent
    pathParams: [model]
    requestFormat: google.generate_content
    responseFormat: google.generate_content
    timeoutMs: 600000
  stream_generate_content:
    modelPassthrough: {}
    path: /v1beta/models/${model}:streamGenerateContent
    pathParams: [model]
    query: { alt: sse }
    requestFormat: google.generate_content
    responseFormat: google.stream_generate_content
    streaming: sse
    timeoutMs: 600000
  embed_content:
    path: /v1beta/models/${model}:embedContent
    pathParams: [model]
    requestFormat: google.embed_content
    responseFormat: google.embed_content
    timeoutMs: 60000
  batch_embed_contents:
    path: /v1beta/models/${model}:batchEmbedContents
    pathParams: [model]
    requestFormat: google.batch_embed_contents
    responseFormat: google.batch_embed_contents
    timeoutMs: 60000
  speech_generate_content:
    method: POST
    path: /v1beta/models/${model}:generateContent
    pathParams: [model]
    requestFormat: google.speech_generate_content
    responseFormat: google.speech_generate_content
    timeoutMs: 120000
  speech_interactions:
    method: POST
    path: /v1beta/interactions
    pathParams: []
    requestFormat: google.speech_interactions
    responseFormat: google.speech_interactions
    nativeProxy: false
    timeoutMs: 120000
