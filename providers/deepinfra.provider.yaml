# Native Chat/catalog continuation: docs/deepinfra-native-catalog.md.
# Endpoint/model source checked 2026-11-03: https://deepinfra.com/blog/qwen3-8-27b-deepinfra
schema: clawrouter.service-provider.v1
id: deepinfra
displayName: DeepInfra
status: experimental
class: openai_compatible
service:
  platform: deepinfra
  kind: model_provider
  upstreamService: deepinfra
  configKeys: [DEEPINFRA_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.deepinfra.com/v1/openai
routing:
  nativePrefixes: [clawrouter-deepinfra, deepinfra]
  modelPrefixes: [deepinfra/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - { id: models.list, endpoint: models_list, methods: [GET] }
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  models_list:
    method: GET
    path: /models
    query: { sort_by: openclaw, filter: with_meta }
    requestFormat: openai.models
    responseFormat: openai.models
    timeoutMs: 5000
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: deepinfra/Qwen/Qwen3.8-27B
      upstream: Qwen/Qwen3.8-27B
      capabilities: [llm.chat]
    - id: deepinfra/deepseek-ai/DeepSeek-V4-Flash
      upstream: deepseek-ai/DeepSeek-V4-Flash
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://api.deepinfra.com/v1/openai/models?sort_by=openclaw&filter=with_meta, https://docs.deepinfra.com/api-reference/models/openai-models]
            checkedAt: "2026-11-03"
            input: [text]
            contextWindow: 1048576
