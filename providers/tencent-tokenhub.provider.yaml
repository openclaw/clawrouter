# Frozen mainland standard contract: docs/tencent-tokenhub-native-catalog.md.
# Primary endpoint, model and postpaid alias evidence checked 2026-11-03.
schema: clawrouter.service-provider.v1
id: tencent-tokenhub
displayName: Tencent TokenHub mainland
status: experimental
class: openai_compatible
service:
  platform: tencent-tokenhub
  kind: model_provider
  upstreamService: tencent-tokenhub
  configKeys: [TOKENHUB_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://tokenhub.tencentmaas.com/v1
routing:
  nativePrefixes: [clawrouter-tencent-tokenhub, tencent-tokenhub]
  modelPrefixes: [tencent-tokenhub/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: models.list
    endpoint: models_list
    methods: [GET]
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  models_list:
    path: /models
    requestFormat: openai.models
    responseFormat: openai.models
    streaming: none
    timeoutMs: 30000
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: tencent-tokenhub/deepseek-v4-flash
      upstream: deepseek-v4-flash
      capabilities: [llm.chat]
    - id: tencent-tokenhub/hy3-preview
      upstream: hy3-preview
      capabilities: [llm.chat]
      availability:
        version: clawrouter.model-availability.v1
        status: upstream_alias
        servingModel: hy3
        effectiveAt: "2026-08-31"
        checkedAt: "2026-11-03"
        sources: [https://cloud.tencent.com/announce/detail/2391]
    - id: tencent-tokenhub/hy3
      upstream: hy3
      capabilities: [llm.chat]
      supportedReasoningEfforts: [none, high]
      requestParameters:
        chat_completions:
          sources:
            - https://cloud.tencent.com/document/product/1823/132252
            - https://cloud.tencent.com/document/product/1823/131208
          checkedAt: "2026-11-03"
          toolCalling: supported
          defaultReasoningEffort: high
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://cloud.tencent.com/document/product/1823/132252]
            checkedAt: "2026-11-03"
            input: [text]
    - id: tencent-tokenhub/hy4-preview
      upstream: hy4-preview
      capabilities: [llm.chat]
      supportedReasoningEfforts: [none, high]
      requestParameters:
        chat_completions:
          sources:
            - https://cloud.tencent.com/document/product/1823/132252
            - https://cloud.tencent.com/document/product/1823/131208
          checkedAt: "2026-11-03"
          toolCalling: supported
          defaultReasoningEffort: high
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://cloud.tencent.com/document/product/1823/132252]
            checkedAt: "2026-11-03"
            input: [text]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
