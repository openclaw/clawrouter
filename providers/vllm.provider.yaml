# Configured server transport: docs/local-engine-transports.md.
# Endpoint/model source checked 2026-11-03: https://docs.vllm.ai/en/latest/serving/online_serving/
schema: clawrouter.service-provider.v1
id: vllm
displayName: vLLM
status: experimental
class: openai_compatible
service:
  platform: vllm
  kind: model_provider
  upstreamService: vllm
  configKeys: [VLLM_API_KEY, VLLM_BASE_URL, VLLM_MODEL]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
      required: false
baseUrls:
  default: ${base_url}
routing:
  nativePrefixes: [clawrouter-vllm, vllm]
  modelPrefixes: [vllm/]
  baseUrlParam: base_url
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - { id: models.list, endpoint: models_list, methods: [GET] }
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  models_list: { method: GET, path: /models, requestFormat: openai.models, responseFormat: openai.models, timeoutMs: 30000 }
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: vllm/configured
      upstream: ${model}
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
