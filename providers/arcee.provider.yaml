# Direct hosted Chat only; frozen cards and boundaries: docs/arcee-native-chat.md.
# Endpoint/model source checked 2026-11-03: https://docs.arcee.ai/api-reference/your-first-api-call
schema: clawrouter.service-provider.v1
id: arcee
displayName: Arcee Platform
status: experimental
class: openai_compatible
service:
  platform: arcee
  kind: model_provider
  upstreamService: arcee
  configKeys: [ARCEEAI_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.arcee.ai/api/v1
routing:
  nativePrefixes: [clawrouter-arcee, arcee]
  modelPrefixes: [arcee/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: arcee/trinity-mini
      displayName: "Trinity Mini"
      upstream: trinity-mini
      capabilities: [llm.chat]
      requestParameters:
        chat_completions:
          sources: [https://www.arcee.ai/trinity, https://docs.arcee.ai/capabilities/function-calling]
          checkedAt: "2026-11-03"
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/arcee/models.ts, https://www.arcee.ai/trinity]
            checkedAt: "2026-11-03"
            input: [text]
    - id: arcee/trinity-large-preview
      displayName: "Trinity Large Preview"
      upstream: trinity-large-preview
      capabilities: [llm.chat]
      requestParameters:
        chat_completions:
          sources: [https://www.arcee.ai/trinity, https://docs.arcee.ai/capabilities/function-calling]
          checkedAt: "2026-11-03"
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/arcee/models.ts, https://www.arcee.ai/trinity]
            checkedAt: "2026-11-03"
            input: [text]
    - id: arcee/trinity-large-thinking
      displayName: "Trinity Large Thinking"
      upstream: trinity-large-thinking
      capabilities: [llm.chat]
      requestParameters:
        chat_completions:
          sources: [https://www.arcee.ai/trinity, https://docs.arcee.ai/capabilities/reasoning-traces]
          checkedAt: "2026-11-03"
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/arcee/models.ts, https://www.arcee.ai/trinity]
            checkedAt: "2026-11-03"
            input: [text]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
