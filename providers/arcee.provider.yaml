# Hosted Chat API only; product boundaries: docs/hosted-catalog-providers.md.
# Endpoint/model source checked 2026-11-03: https://docs.arcee.ai/api-reference/your-first-api-call
schema: clawrouter.service-provider.v1
id: arcee
displayName: Arcee Platform
status: experimental
class: openai_compatible
service:
  platform: arcee
  kind: model_provider
  upstreamService: arcee
  configKeys: [ARCEEAI_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.arcee.ai/api/v1
routing:
  nativePrefixes: [clawrouter-arcee, arcee]
  modelPrefixes: [arcee/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: arcee/trinity-mini
      upstream: trinity-mini
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
