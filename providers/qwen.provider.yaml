# Standard API only; region and plan contracts: docs/hosted-asia-providers.md.
# Endpoint/model source checked 2026-11-03: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema: clawrouter.service-provider.v1
id: qwen
displayName: Qwen (Model Studio Singapore)
status: experimental
class: openai_compatible
service:
  platform: qwen
  kind: model_provider
  upstreamService: qwen
  configKeys: [QWEN_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
routing:
  nativePrefixes: [clawrouter-qwen, qwen]
  modelPrefixes: [qwen/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: qwen/qwen3.8-max
      upstream: qwen3.8-max
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
