# Standard API only; region and plan contracts: docs/hosted-asia-providers.md.
# Endpoint/model source checked 2026-11-03: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema: clawrouter.service-provider.v1
id: qwen
displayName: Qwen (Model Studio Singapore)
status: experimental
class: openai_compatible
service:
  platform: qwen
  kind: model_provider
  upstreamService: qwen
  configKeys: [QWEN_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
routing:
  nativePrefixes: [clawrouter-qwen, qwen]
  modelPrefixes: [qwen/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: qwen/qwen3.5-plus
      upstream: qwen3.5-plus
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/qwen/models.ts, https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/qwen/openclaw.plugin.json]
            checkedAt: "2026-11-04"
            input: [text, image]
