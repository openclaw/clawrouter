# Frozen PAYG inventory and dated retirements: docs/xiaomi-payg-contracts.md.
# Endpoint/model source checked 2026-11-03: https://mimo.mi.com/docs/en-US/quick-start/summary/first-api-call
schema: clawrouter.service-provider.v1
id: xiaomi
displayName: Xiaomi MiMo PAYG
status: experimental
class: openai_compatible
service:
  platform: xiaomi
  kind: model_provider
  upstreamService: xiaomi
  configKeys: [XIAOMI_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.xiaomimimo.com/v1
routing:
  nativePrefixes: [clawrouter-xiaomi, xiaomi]
  modelPrefixes: [xiaomi/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: xiaomi/mimo-v2.6-pro
      displayName: "MiMo V2.6 Pro"
      upstream: mimo-v2.6-pro
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/xiaomi/openclaw.plugin.json]
            checkedAt: "2026-11-04"
            input: [text, image]
    - id: xiaomi/mimo-v2.6-flash
      displayName: "MiMo V2.6 Flash"
      upstream: mimo-v2.6-flash
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources: [https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/xiaomi/openclaw.plugin.json]
            checkedAt: "2026-11-04"
            input: [text, image]
    - id: xiaomi/mimo-v2.5-pro
      displayName: "MiMo V2.5 Pro"
      upstream: mimo-v2.5-pro
      capabilities: []
      availability:
        version: clawrouter.model-availability.v1
        status: stopped
        effectiveAt: "2026-10-21"
        checkedAt: "2026-11-03"
        sources: [https://mimo.mi.com/docs/en-US/updates/deprecate]
    - id: xiaomi/mimo-v2.5
      displayName: "MiMo V2.5"
      upstream: mimo-v2.5
      capabilities: []
      availability:
        version: clawrouter.model-availability.v1
        status: stopped
        effectiveAt: "2026-10-21"
        checkedAt: "2026-11-03"
        sources: [https://mimo.mi.com/docs/en-US/updates/deprecate]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
