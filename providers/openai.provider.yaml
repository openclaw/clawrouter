schema: clawrouter.service-provider.v1
id: openai
displayName: OpenAI
status: stable
class: openai_compatible
modelDiscovery:
  adapter: openai.models
service:
  platform: openai
  kind: model_provider
  upstreamService: openai
  configKeys: [OPENAI_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
  # No bundled browser onboarding: see docs/openai-subscriptions.md.
  # Retain refresh/transport for the released stored-grant contract.
  refresh:
    tokenUrl: https://auth.openai.com/oauth/token
    clientId: app_EMoamEEZ73f0CkXaXp7hrann
  grantTransports:
    subscription:
      baseUrl: https://chatgpt.com/backend-api/codex
      allowedEndpoints: [responses]
      endpointPaths:
        responses: /responses
      headers:
        ChatGPT-Account-ID: "${grant.accountId}"
        OpenAI-Beta: responses=experimental
        originator: clawrouter
baseUrls:
  default: https://api.openai.com
routing:
  nativePrefixes: [clawrouter-openai, openai]
  modelPrefixes: [openai/]
  baseUrlParam: base_url
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
  passthroughHeaders: [OpenAI-Organization, OpenAI-Project]
  requestTransforms:
    renameFields:
      - from: max_tokens
        to: max_completion_tokens
        paths: [/v1/chat/completions]
        upstreams: [gpt-6-astra, gpt-6-sol, gpt-6-luna, gpt-5.6, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5, gpt-5.4]
quota:
  responseHeaders:
    - id: rpm
      kind: requests
      unit: request
      window: minute
      limitHeaders: [x-ratelimit-limit-requests]
      remainingHeaders: [x-ratelimit-remaining-requests]
      resetHeaders: [x-ratelimit-reset-requests]
    - id: tpm
      kind: tokens
      unit: token
      window: minute
      limitHeaders: [x-ratelimit-limit-tokens]
      remainingHeaders: [x-ratelimit-remaining-tokens]
      resetHeaders: [x-ratelimit-reset-tokens]
    - id: subscription-primary
      kind: subscription
      unit: percent
      window: primary
      fixedLimit: 100
      usedHeaders: [x-codex-primary-used-percent]
      resetHeaders: [x-codex-primary-reset-at]
    - id: subscription-secondary
      kind: subscription
      unit: percent
      window: secondary
      fixedLimit: 100
      usedHeaders: [x-codex-secondary-used-percent]
      resetHeaders: [x-codex-secondary-reset-at]
    - id: credits
      kind: credits
      unit: credit
      remainingHeaders: [x-codex-credits-balance]
  probes:
    - grantKinds: [subscription]
      url: https://chatgpt.com/backend-api/wham/usage
      headers:
        ChatGPT-Account-ID: "${grant.accountId}"
        User-Agent: codex-cli
      windows:
        - id: subscription-primary
          kind: subscription
          unit: percent
          window: primary
          fixedLimit: 100
          usedPointer: /rate_limit/primary_window/used_percent
          resetPointer: /rate_limit/primary_window/reset_at
        - id: subscription-secondary
          kind: subscription
          unit: percent
          window: secondary
          fixedLimit: 100
          usedPointer: /rate_limit/secondary_window/used_percent
          resetPointer: /rate_limit/secondary_window/reset_at
        - id: credits
          kind: credits
          unit: credit
          remainingPointer: /credits/balance
capabilities:
  - id: llm.responses
    endpoint: responses
    methods: [POST]
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: llm.embeddings
    endpoint: embeddings
    methods: [POST]
  - id: audio.speech
    endpoint: speech
    methods: [POST]
endpoints:
  responses:
    modelPassthrough: {}
    path: /v1/responses
    requestHeaders: [session-id, thread-id, session_id, x-client-request-id, OpenAI-Beta, x-openai-internal-codex-responses-lite, x-codex-beta-features, x-codex-turn-state]
    requestFormat: openai.responses
    responseFormat: openai.responses
    streaming: sse
    websocket: openai.responses
    timeoutMs: 600000
  chat_completions:
    modelPassthrough: {}
    path: /v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  embeddings:
    modelPassthrough: {}
    path: /v1/embeddings
    requestFormat: openai.embeddings
    responseFormat: openai.embeddings
    timeoutMs: 120000
  speech:
    path: /v1/audio/speech
    requestFormat: openai.audio_speech
    responseFormat: audio.binary
    streaming: audio
    timeoutMs: 120000
