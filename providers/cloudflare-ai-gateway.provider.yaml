schema: clawrouter.service-provider.v1
id: cloudflare-ai-gateway
displayName: Cloudflare AI Gateway
status: experimental
class: cloudflare_ai_gateway
service:
  platform: cloudflare-ai-gateway
  kind: gateway_platform
  upstreamService: cloudflare
  configKeys: [CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_AI_GATEWAY_ID, CLOUDFLARE_API_TOKEN]
auth:
  schemes:
    - type: bearer
      header: cf-aig-authorization
      format: "Bearer ${secret}"
      secretKind: api_token
baseUrls:
  default: https://gateway.ai.cloudflare.com/v1/${account_id}/${gateway_id}
routing:
  nativePrefixes: [clawrouter-cloudflare, cloudflare-ai-gateway]
  modelPrefixes: [cloudflare-ai-gateway/]
  baseUrlParam: base_url
adapter:
  request: cloudflare_ai_gateway
  response: provider_native
  stream: provider_sse
  error: cloudflare_error
capabilities:
  - id: llm.messages
    endpoint: messages
    methods: [POST]
  - id: llm.chat
    endpoint: universal
    methods: [POST]
  - id: llm.responses
    endpoint: universal
    methods: [POST]
endpoints:
  messages:
    path: /anthropic/v1/messages
    requestFormat: anthropic.messages
    responseFormat: anthropic.messages
    streaming: sse
    headers:
      anthropic-version: "2023-06-01"
    requestHeaders: [anthropic-beta]
    timeoutMs: 600000
  universal:
    path: /
    requestFormat: cloudflare_ai_gateway.universal
    responseFormat: provider.native
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: cloudflare-ai-gateway/auto
      upstream: auto
      capabilities: [llm.chat, llm.responses]
      pricingRef: cloudflare-ai-gateway-auto
    - id: cloudflare-ai-gateway/claude-sonnet-4-6
      upstream: claude-sonnet-4-6
      capabilities: [llm.messages]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          messages:
            sources:
              - https://developers.cloudflare.com/ai-gateway/usage/providers/anthropic/
              - https://developers.cloudflare.com/ai/models/anthropic/claude-sonnet-4.6/
              - https://platform.claude.com/docs/en/models/sonnet-4-6/overview
            checkedAt: "2026-11-03"
            input: [text, image]
            contextWindow: 200000
      # Gateway BYOK/Unified Billing and account settings determine actual costs.
      # Do not inherit first-party Anthropic prices or certify unknown charges.
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
  counters:
    - name: request
      source: request.count
      unit: request
