schema: clawrouter.service-provider.v1
id: deepseek
displayName: DeepSeek
status: stable
class: openai_compatible
service:
  platform: deepseek
  kind: model_provider
  upstreamService: deepseek
  configKeys: [DEEPSEEK_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.deepseek.com
routing:
  nativePrefixes: [clawrouter-deepseek, deepseek]
  modelPrefixes: [deepseek/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    outputTokenLimit: { field: max_tokens, minimum: 1, maximum: 393216 }
    timeoutMs: 600000
models:
  entries:
    - id: deepseek/deepseek-v4-pro
      upstream: deepseek-v4-pro
      capabilities: [llm.chat]
      supportedReasoningEfforts: [none, low, high, max]
      requestParameters:
        chat_completions:
          sources:
            - https://api-docs.deepseek.com/api/create-chat-completion/
          checkedAt: "2026-11-03"
          defaultReasoningEffort: high
          temperature: requires_reasoning_none
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://api-docs.deepseek.com/quick_start/pricing/
              - https://api-docs.deepseek.com/api/create-chat-completion/
            checkedAt: "2026-11-03"
            input: [text]
            maxOutputTokens: 393216
      pricingRef: deepseek-v4-pro-peak-upper-bound-2026-09-23
      pricing:
        effectiveAt: "2026-09-23"
        checkedAt: "2026-11-03"
        source: https://api-docs.deepseek.com/quick_start/pricing
        settlementBasis: published_upper_bound
        inputMicrosPerMillion: 1320000
        cachedInputMicrosPerMillion: 44000
        outputMicrosPerMillion: 3960000
        maxInputTokens: 1048576
        defaultMaxOutputTokens: 393216
    - id: deepseek/deepseek-v4-flash
      upstream: deepseek-v4-flash
