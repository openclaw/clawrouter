schema: clawrouter.service-provider.v1
id: xai
displayName: xAI
status: stable
class: openai_compatible
service:
  platform: xai
  kind: model_provider
  upstreamService: xai
  configKeys: [XAI_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.x.ai
routing:
  nativePrefixes: [clawrouter-xai, xai]
  modelPrefixes: [xai/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: xai/grok-4.3
      displayName: "Grok 4.3"
      upstream: grok-4.3
      capabilities: [llm.chat]
      pricingRef: xai-grok-4-3-standard-2026-06-21
      pricing:
        effectiveAt: "2026-06-21"
        checkedAt: "2026-11-04"
        source: https://docs.x.ai/developers/pricing
        inputMicrosPerMillion: 1250000
        cachedInputMicrosPerMillion: 200000
        outputMicrosPerMillion: 2500000
        maxInputTokens: 1000000
        defaultMaxOutputTokens: 131072
        longContext:
          # The shared threshold is exclusive; xAI charges long rates at >=200k.
          # https://docs.x.ai/developers/pricing
          thresholdInputTokens: 199999
          inputMicrosPerMillion: 2500000
          cachedInputMicrosPerMillion: 400000
          outputMicrosPerMillion: 5000000
    - id: xai/grok-4.6
      displayName: "Grok 4.6"
      upstream: grok-4.6
      capabilities: [llm.chat]
      supportedReasoningEfforts: [low, medium, high, xhigh]
      requestParameters:
        chat_completions:
          sources:
            - https://docs.x.ai/developers/models/grok-4.6
          checkedAt: "2026-11-04"
          toolCalling: supported
          defaultReasoningEffort: high
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://docs.x.ai/developers/models/grok-4.6
            checkedAt: "2026-11-04"
            input: [text, image]
            contextWindow: 500000
    - id: xai/grok-4.5
      displayName: "Grok 4.5"
      upstream: grok-4.5
      capabilities: [llm.chat]
      supportedReasoningEfforts: [low, medium, high, xhigh]
      requestParameters:
        chat_completions:
          sources:
            - https://docs.x.ai/developers/models/grok-4.5
          checkedAt: "2026-11-04"
          toolCalling: supported
          defaultReasoningEffort: high
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://docs.x.ai/developers/models/grok-4.5
            checkedAt: "2026-11-04"
            input: [text, image]
            contextWindow: 500000
    - id: xai/grok-build-0.1
      displayName: "Grok Build 0.1"
      upstream: grok-build-0.1
      capabilities: [llm.chat]
      requestParameters:
        chat_completions:
          sources:
            - https://docs.x.ai/developers/models/grok-build-0.1
          checkedAt: "2026-11-04"
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://docs.x.ai/developers/models/grok-build-0.1
            checkedAt: "2026-11-04"
            input: [text, image]
            contextWindow: 256000
    - id: xai/grok-4.20-0309-reasoning
      displayName: "Grok 4.20 (0309, Reasoning)"
      upstream: grok-4.20-0309-reasoning
      capabilities: [llm.chat]
      requestParameters:
        chat_completions:
          sources:
            - https://docs.x.ai/developers/models/grok-4.20-0309-reasoning
          checkedAt: "2026-11-04"
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://docs.x.ai/developers/models/grok-4.20-0309-reasoning
            checkedAt: "2026-11-04"
            input: [text, image]
            contextWindow: 1000000
    - id: xai/grok-4.20-0309-non-reasoning
      displayName: "Grok 4.20 (0309, Non-Reasoning)"
      upstream: grok-4.20-0309-non-reasoning
      capabilities: [llm.chat]
      requestParameters:
        chat_completions:
          sources:
            - https://docs.x.ai/developers/models/grok-4.20-0309-non-reasoning
          checkedAt: "2026-11-04"
          toolCalling: supported
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            sources:
              - https://docs.x.ai/developers/models/grok-4.20-0309-non-reasoning
            checkedAt: "2026-11-04"
            input: [text, image]
            contextWindow: 1000000
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
