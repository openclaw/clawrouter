schema: clawrouter.service-provider.v1
id: typesafe
displayName: TypeSafe
status: experimental
class: custom_adapter
service:
  platform: typesafe
  kind: model_provider
  upstreamService: typesafe
  configKeys: [TYPESAFE_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.typesafe.ai/v1
routing:
  nativePrefixes: [clawrouter-typesafe, typesafe]
  modelPrefixes: [typesafe/]
adapter:
  request: systemone
  response: systemone
  error: json_error
capabilities:
  - id: llm.decisions
    endpoint: decisions
    methods: [POST]
endpoints:
  decisions:
    path: /systemone
    requestFormat: systemone.decisions
    responseFormat: systemone.decisions
    timeoutMs: 120000
models:
  entries:
    - id: typesafe/jev-latest
      upstream: jev-latest
      capabilities: [llm.decisions]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
  counters:
    - name: input_tokens
      source: usage.input_tokens
      unit: token
    - name: output_tokens
      source: usage.output_tokens
      unit: token
