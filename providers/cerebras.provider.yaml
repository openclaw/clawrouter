# Hosted Chat and public model metadata; product boundaries: docs/hosted-inference-providers.md.
# Endpoint/model source checked 2026-11-03: https://inference-docs.cerebras.ai/quickstart
# Catalog exposure and authority: docs/public-catalog-declarations.md.
schema: clawrouter.service-provider.v1
id: cerebras
displayName: Cerebras
status: experimental
class: openai_compatible
service:
  platform: cerebras
  kind: model_provider
  upstreamService: cerebras
  configKeys: [CEREBRAS_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://api.cerebras.ai/v1
routing:
  nativePrefixes: [clawrouter-cerebras, cerebras]
  modelPrefixes: [cerebras/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: models.list
    endpoint: public_models
    methods: [GET]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  public_models:
    method: GET
    path: /models
    nativeProxy: false
    requestFormat: cerebras.public_catalog
    responseFormat: cerebras.public_catalog
    headers:
      accept: application/json
    timeoutMs: 10000
models:
  entries:
    - id: cerebras/qwen-3.8-27b
      upstream: qwen-3.8-27b
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
