schema: clawrouter.service-provider.v1
id: azure-openai
displayName: Azure OpenAI
status: stable
class: openai_compatible
service:
  platform: azure
  kind: model_provider
  upstreamService: azure-openai
  configKeys:
    [
      AZURE_OPENAI_API_KEY,
      AZURE_OPENAI_ENDPOINT,
      AZURE_OPENAI_API_VERSION,
      AZURE_OPENAI_COMPLETION_TOKEN_DEPLOYMENTS,
      AZURE_OPENAI_DEPLOYMENT,
    ]
  optionalConfigKeys: [AZURE_OPENAI_COMPLETION_TOKEN_DEPLOYMENTS, AZURE_OPENAI_API_VERSION, AZURE_OPENAI_DEPLOYMENT]
auth:
  schemes:
    - type: api_key
      header: api-key
      secretKind: api_key
baseUrls:
  default: ${endpoint}
routing:
  nativePrefixes: [clawrouter-azure-openai, azure-openai]
  modelPrefixes: [azure-openai/]
  baseUrlParam: endpoint
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
  requestTransforms:
    renameFields:
      - from: max_tokens
        to: max_completion_tokens
        paths: [/v1/chat/completions]
        upstreamConfig: completion_token_deployments
capabilities:
  - id: llm.responses
    endpoint: responses
    methods: [POST]
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: llm.embeddings
    endpoint: embeddings
    methods: [POST]
endpoints:
  responses:
    modelPassthrough: {}
    path: /openai/v1/responses
    requestFormat: openai.responses
    responseFormat: openai.responses
    streaming: sse
    timeoutMs: 600000
  chat_completions:
    modelPassthrough: {}
    path: /openai/deployments/${deployment}/chat/completions
    pathParams: [deployment]
    query:
      api-version: ${api_version}
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  embeddings:
    modelPassthrough: {}
    path: /openai/deployments/${deployment}/embeddings
    pathParams: [deployment]
    query:
      api-version: ${api_version}
    requestFormat: openai.embeddings
    responseFormat: openai.embeddings
    timeoutMs: 120000
models:
  entries:
    - id: azure-openai/deployment
      upstream: ${deployment}
      capabilities: [llm.chat, llm.embeddings]
      pricingRef: azure-openai-deployment
billing:
  meter: clawrouter.tokens
  dimensions: [provider, deployment, key, service, subject]
