# Operator-hosted transport only: docs/configured-gateway-providers.md.
# Endpoint/model source checked 2026-11-03: https://docs.litellm.ai/docs/proxy/docker_quick_start
schema: clawrouter.service-provider.v1
id: litellm
displayName: LiteLLM gateway
status: experimental
class: openai_compatible
service:
  platform: litellm
  kind: gateway_platform
  upstreamService: litellm
  configKeys: [LITELLM_API_KEY, LITELLM_BASE_URL, LITELLM_MODEL]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: ${base_url}
routing:
  nativePrefixes: [clawrouter-litellm, litellm]
  modelPrefixes: [litellm/]
  baseUrlParam: base_url
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: litellm/configured
      upstream: ${model}
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
