# API-key subset; remaining contracts: docs/cloud-key-providers.md.
# Endpoint/model source checked 2026-11-03: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-chat-completions.html
schema: clawrouter.service-provider.v1
id: amazon-bedrock-mantle
displayName: Amazon Bedrock Mantle us-east-1
status: experimental
class: openai_compatible
service:
  platform: amazon-bedrock-mantle
  kind: model_provider
  upstreamService: amazon-bedrock-mantle
  configKeys: [BEDROCK_MANTLE_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://bedrock-mantle.us-east-1.api.aws/v1
routing:
  nativePrefixes: [clawrouter-amazon-bedrock-mantle, amazon-bedrock-mantle]
  modelPrefixes: [amazon-bedrock-mantle/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: amazon-bedrock-mantle/openai.gpt-oss-120b
      displayName: "GPT-OSS 120B"
      upstream: openai.gpt-oss-120b
      capabilities: [llm.chat]
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
