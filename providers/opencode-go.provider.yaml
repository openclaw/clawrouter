# Frozen native API bindings and activation boundaries: docs/opencode-native-catalog.md.
# Endpoint/model source checked 2026-11-04: https://opencode.ai/v2/docs/console/go/
schema: clawrouter.service-provider.v1
id: opencode-go
displayName: OpenCode Go
status: experimental
class: openai_compatible
service:
  platform: opencode-go
  kind: gateway_platform
  upstreamService: opencode-go
  configKeys: [OPENCODE_GO_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://opencode.ai
routing:
  nativePrefixes: [clawrouter-opencode-go, opencode-go]
  modelPrefixes: [opencode-go/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
  - id: llm.messages
    endpoint: messages
    methods: [POST]
  - id: llm.responses
    endpoint: responses
    methods: [POST]
endpoints:
  chat_completions:
    modelPassthrough: {}
    path: /chat/completions
    upstreamPath: /inference/go/openai/v1/chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
  messages:
    path: /v1/messages
    upstreamPath: /inference/go/anthropic/v1/messages
    requestHeaders: [anthropic-beta, anthropic-version]
    requestFormat: anthropic.messages
    responseFormat: anthropic.messages
    streaming: sse
    timeoutMs: 600000
  responses:
    path: /v1/responses
    upstreamPath: /inference/go/openai/v1/responses
    requestFormat: openai.responses
    responseFormat: openai.responses
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: opencode-go/glm-5.3
      upstream: glm-5.3
      capabilities: [llm.chat]
    - id: opencode-go/deepseek-v4-pro
      upstream: deepseek-v4-pro
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            input: [text]
            inference: { chat: true }
            checkedAt: '2026-11-04'
            sources:
              - https://github.com/openclaw/openclaw/blob/31ad71a8addc1d42fbc5478f7e114860f5cbf6c7/extensions/opencode-go/openclaw.plugin.json
              - https://opencode.ai/v2/docs/console/go/
    - id: opencode-go/deepseek-v4.1-flash
      upstream: deepseek-v4.1-flash
      capabilities: [llm.chat]
      nativeCapabilities:
        version: clawrouter.native-capabilities.v1
        endpoints:
          chat_completions:
            input: [text, image]
            inference: { chat: true }
            checkedAt: '2026-11-04'
            sources:
