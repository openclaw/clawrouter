# Frozen plan inventory, aliases and retirement dispositions: docs/ark-coding-plans.md.
# Primary endpoint checked 2026-11-03; no standard API or cross-region key fallback.
schema: clawrouter.service-provider.v1
id: volcengine-plan
displayName: Volcengine Coding Plan (Beijing)
status: experimental
class: openai_compatible
service:
  platform: volcengine
  kind: model_provider
  upstreamService: volcengine-plan
  configKeys: [VOLCENGINE_PLAN_API_KEY]
auth:
  schemes:
    - type: bearer
      header: Authorization
      format: "Bearer ${secret}"
      secretKind: api_key
baseUrls:
  default: https://ark.cn-beijing.volces.com/api/coding/v3
routing:
  nativePrefixes: [clawrouter-volcengine-plan, volcengine-plan]
  modelPrefixes: [volcengine-plan/]
adapter:
  request: openai
  response: openai
  stream: openai_sse
  error: openai_error
capabilities:
  - id: llm.chat
    endpoint: chat_completions
    methods: [POST]
endpoints:
  chat_completions:
    path: /chat/completions
    requestFormat: openai.chat_completions
    responseFormat: openai.chat_completions
    streaming: sse
    timeoutMs: 600000
models:
  entries:
    - id: volcengine-plan/ark-code-latest
      upstream: ark-code-latest
      capabilities: [llm.chat]
    - id: volcengine-plan/deepseek-v4-pro
      upstream: deepseek-v4-pro
      capabilities: [llm.chat]
    - id: volcengine-plan/deepseek-v4-flash
      upstream: deepseek-v4-flash
      capabilities: [llm.chat]
    - id: volcengine-plan/doubao-seed-2.1-turbo
      upstream: doubao-seed-2.1-turbo
      capabilities: []
      availability:
        version: clawrouter.model-availability.v1
        status: stopped
        effectiveAt: '2026-10-09'
        checkedAt: '2026-11-03'
        sources:
          - https://docs.volcengine.com/docs/ark/coding-plan-personal-model-deprecation?lang=zh
    # Keep the selected identity; legacy account access and native alias proof are pending.
    - id: volcengine-plan/glm-5.2
      upstream: glm-5.2
      capabilities: []
      availability:
        version: clawrouter.model-availability.v1
        status: upstream_alias
        servingModel: glm-5.3
        effectiveAt: '2026-08-31'
        checkedAt: '2026-11-03'
        sources:
          - https://docs.volcengine.com/docs/ark/coding-plan-personal-model-deprecation?lang=zh
billing:
  meter: clawrouter.tokens
  dimensions: [provider, model, key, service, subject]
