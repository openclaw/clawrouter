name: Read-only native rehearsal preflight

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed 40-character main commit; this workflow never provisions
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: clawrouter-native-preflight
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  PREFLIGHT_RECEIPT: ${{ runner.temp }}/native-preflight.json

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard reviewed main source before checkout or credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          const accepted = e.GITHUB_REPOSITORY === 'openclaw/clawrouter' &&
            e.GITHUB_EVENT_NAME === 'workflow_dispatch' && e.GITHUB_REF === 'refs/heads/main' &&
            /^[a-f0-9]{40}$/.test(e.EXPECTED_SHA ?? '') && e.EXPECTED_SHA === e.GITHUB_SHA;
          writeFileSync(e.PREFLIGHT_RECEIPT, JSON.stringify({ schema: 1, readOnly: true,
            qualified: false, provisioningAllowed: false, status: 'blocked',
            blockers: [accepted ? 'preflight_not_completed' : 'source_guard'] }) + '\n', { mode: 0o600 });
          if (!accepted) { console.error('Expected exact reviewed main source.'); process.exit(1); }
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Read bounded Cloudflare metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRESENT_NATIVE_QUALIFICATION_CF_API_TOKEN: ${{ secrets.NATIVE_QUALIFICATION_CF_API_TOKEN != '' }}
          PRESENT_NATIVE_QUALIFICATION_CF_ACCOUNT_ID: ${{ secrets.NATIVE_QUALIFICATION_CF_ACCOUNT_ID != '' }}
          PRESENT_NATIVE_QUALIFICATION_ADMIN_TOKEN: ${{ secrets.NATIVE_QUALIFICATION_ADMIN_TOKEN != '' }}
          PRESENT_NATIVE_QUALIFICATION_ACCESS_CLIENT_ID: ${{ secrets.NATIVE_QUALIFICATION_ACCESS_CLIENT_ID != '' }}
          PRESENT_NATIVE_QUALIFICATION_ACCESS_CLIENT_SECRET: ${{ secrets.NATIVE_QUALIFICATION_ACCESS_CLIENT_SECRET != '' }}
          PRESENT_CLAWROUTER_NATIVE_ADMIN_TOKEN: ${{ secrets.CLAWROUTER_NATIVE_ADMIN_TOKEN != '' }}
          PRESENT_CLAWROUTER_NATIVE_ACCESS_CLIENT_ID: ${{ secrets.CLAWROUTER_NATIVE_ACCESS_CLIENT_ID != '' }}
          PRESENT_CLAWROUTER_NATIVE_ACCESS_CLIENT_SECRET: ${{ secrets.CLAWROUTER_NATIVE_ACCESS_CLIENT_SECRET != '' }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/preflight-native-rehearsal.mjs
      - name: Retain only safe metadata receipt including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-preflight.json
          if-no-files-found: error
          retention-days: 1
