            test: test/openclaw-tencent.test.mjs
          - consumer: xiaomi
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-xiaomi.test.mjs
          - consumer: zai
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-zai.test.mjs
          - consumer: qwen-global
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-qwen-global.test.mjs
          - consumer: gemini36
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-gemini36.test.mjs
          - consumer: gemini35lite
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-gemini35lite.test.mjs
          - consumer: gemini31pro
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-gemini31pro.test.mjs
          - consumer: gemini38
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-gemini38.test.mjs
          - consumer: vertex
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-vertex.test.mjs
          - consumer: google-images
            ref: 4d052fa8347c97e876eb885789a82730e860a62f
            test: test/openclaw-google-images.test.mjs
          - consumer: lyria
            ref: 3645a2c86518e9e98e4df2a81d00355bc6b082c0
            test: test/openclaw-lyria.test.mjs
          - consumer: requesty-catalog
            ref: 1536faab19f2adf524b7ef1acef5c24501b35652
            test: test/openclaw-requesty-catalog.test.mjs
          - consumer: deepseek-search
            ref: 82dd065e23b678e61ad497f9d57fbb4c3da10eae
            test: test/openclaw-deepseek-search.test.mjs
          - consumer: google-speech
            ref: ff34cf8e236ca698c7190c63087f2ecd37f94a7e
            test: test/openclaw-google-speech.test.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Check out the pinned public consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: ${{ matrix.ref }}
          path: .openclaw-contract
          persist-credentials: false
          fetch-depth: 1
      - name: Use the consumer's own package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .openclaw-contract/package.json
          dest: ~/setup-pnpm-openclaw
      - name: Cache native pnpm downloads
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: .openclaw-contract/pnpm-lock.yaml
      - name: Install this revision's frozen dependencies
        working-directory: .openclaw-contract
        run: |
          pnpm install --frozen-lockfile
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})'
          pnpm --version
      - name: Actual consumer through workerd and SQLite
        run: node --test "$CONTRACT_TEST"
        env:
          CONTRACT_TEST: ${{ matrix.test }}
          CLAWROUTER_OPENCLAW_CHECKOUT: .openclaw-contract


  search-consumer:
    needs: [consumer-changes, consumer]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected consumer
        run: |
          if [ "$SELECTION_RESULT" = success ] && [ "$CONSUMERS_REQUIRED" = false ]; then
            test "$CONSUMER_RESULT" = skipped
          else
            test "$CONSUMER_RESULT" = success
          fi
        env:
          SELECTION_RESULT: ${{ needs.consumer-changes.result }}
          CONSUMERS_REQUIRED: ${{ needs.consumer-changes.outputs.required }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
