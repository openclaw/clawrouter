name: OpenClaw consumer contract

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: openclaw-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  consumer-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - id: select
        run: node scripts/openclaw-contract-changes.mjs

  search-consumer:
    needs: consumer-changes
    # Keep the existing check visible on every PR. Unknown/failed selection runs
    # the full suite; concurrency cancellation must not start another checkout.
    if: ${{ !cancelled() && (needs.consumer-changes.result != 'success' || needs.consumer-changes.outputs.required != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Check out the actual public OpenClaw consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 1c72f546f839d2790168cd15a9f9d18afaf014ff
          path: .openclaw-contract
          persist-credentials: false
          fetch-depth: 1
      - name: Use OpenClaw's own package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .openclaw-contract/package.json
          dest: ~/setup-pnpm-openclaw
      - name: Install frozen native client dependencies in the ephemeral checkout
        run: pnpm install --frozen-lockfile
        working-directory: .openclaw-contract
      - name: Actual plugin through workerd and SQLite
        run: node --test test/openclaw-search.test.mjs
        env:
          CLAWROUTER_OPENCLAW_CHECKOUT: .openclaw-contract
      - name: Freeze the installed client's dependency inputs
        working-directory: .openclaw-contract
        run: git ls-files --stage -- '*package.json' pnpm-lock.yaml pnpm-workspace.yaml '.npmrc' '**/.npmrc' '.pnpmfile.*' 'patches/**' '**/patches/**' > "$RUNNER_TEMP/openclaw-dependency-inputs"
      - name: Check out the actual public memory consumer in the same ephemeral checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 9d2be9d82c2a6973ae1b025eac4a636964397c28
          path: .openclaw-contract
          persist-credentials: false
          fetch-depth: 1
          clean: false
      - name: Qualify reuse of this checkout's own frozen install
        working-directory: .openclaw-contract
        run: |
          git ls-files --stage -- '*package.json' pnpm-lock.yaml pnpm-workspace.yaml '.npmrc' '**/.npmrc' '.pnpmfile.*' 'patches/**' '**/patches/**' | cmp "$RUNNER_TEMP/openclaw-dependency-inputs" -
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})'
          pnpm --version
      - name: Actual memory transport through workerd and SQLite
        run: node --test test/openclaw-embeddings.test.mjs
        env:
          CLAWROUTER_OPENCLAW_CHECKOUT: .openclaw-contract
      - name: Check out the actual public TTS and Talk consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 70fcd8cb826f1e70ee59aacaf442e4cf411c7ca4
          path: .openclaw-contract
          persist-credentials: false
          fetch-depth: 1
          clean: false
      - name: Qualify the speech checkout against the same frozen install
        working-directory: .openclaw-contract
        run: |
          git ls-files --stage -- '*package.json' pnpm-lock.yaml pnpm-workspace.yaml '.npmrc' '**/.npmrc' '.pnpmfile.*' 'patches/**' '**/patches/**' | cmp "$RUNNER_TEMP/openclaw-dependency-inputs" -
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})'
          pnpm --version
      - name: Actual TTS and Talk through workerd and SQLite
        run: node --test test/openclaw-speech.test.mjs
        env:
          CLAWROUTER_OPENCLAW_CHECKOUT: .openclaw-contract
      # New SDK exports change a frozen package input. Checkout cleans only this
      # ephemeral client's old install before its own new native installation.
      - name: Check out the actual public native memory consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: 5964e1f3065337b92a733e42cc248bf5e27a5415
          path: .openclaw-contract
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Install this native memory candidate's own frozen dependencies
        working-directory: .openclaw-contract
        run: |
          pnpm install --frozen-lockfile
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})'
          pnpm --version
      - name: Actual native memory factory through workerd and SQLite
        run: node --test test/openclaw-native-embeddings.test.mjs
        env:
          CLAWROUTER_OPENCLAW_CHECKOUT: .openclaw-contract
