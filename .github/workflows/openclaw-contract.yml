name: OpenClaw consumer contract

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: openclaw-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  consumer-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - id: select
        run: node scripts/openclaw-contract-changes.mjs

  consumer:
    needs: consumer-changes
    if: ${{ !cancelled() && (needs.consumer-changes.result != 'success' || needs.consumer-changes.outputs.required != 'false') }}
    name: consumer (${{ matrix.consumer }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - consumer: volcengine-payg
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-volcengine-payg.test.mjs
          - consumer: search
            ref: 0a5f30f82d33eae69d10c5a5ceecd01bdb9706e7
            test: test/openclaw-search.test.mjs
          - consumer: embeddings
            ref: 9d2be9d82c2a6973ae1b025eac4a636964397c28
            test: test/openclaw-embeddings.test.mjs
          - consumer: speech
            ref: 70fcd8cb826f1e70ee59aacaf442e4cf411c7ca4
            test: test/openclaw-speech.test.mjs
          - consumer: native-memory
            ref: 60e29ff604075d6961e19469a60530782fb644f7
            test: test/openclaw-native-embeddings.test.mjs
          - consumer: bedrock-memory
            ref: 0eed32b19ce3eb54b38c7dde1b88d0cf2f9613cd
            test: test/openclaw-bedrock-memory.test.mjs
          - consumer: cohere
            ref: b566e9a6b22a863bf0f1f869f106a2a91b062f16
            test: test/openclaw-cohere.test.mjs
          - consumer: gradium
            ref: d2e88f6ff4b34b2141ee67b30a4c2783adf0f38c
            test: test/openclaw-gradium.test.mjs
          - consumer: vercel
            ref: 0093b58c0d132ae1707f9553839f1cf297fb9a25
            test: test/openclaw-vercel.test.mjs
          - consumer: elevenlabs
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-elevenlabs.test.mjs
          - consumer: wan
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-wan.test.mjs
          - consumer: pixverse
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-pixverse.test.mjs
          - consumer: runway
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-runway.test.mjs
          - consumer: runway-defaults
            ref: b01d76f2480c8d6c5c6b918a6fb71acdf3cfe17a
            test: test/openclaw-runway-defaults.test.mjs
          - consumer: chutes
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-chutes.test.mjs
          - consumer: featherless
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-featherless.test.mjs
          - consumer: azure
            ref: 4e27e9ab53dd7215f84ffa06ef5f193be7fb603b
            test: test/openclaw-azure.test.mjs
          - consumer: venice
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-venice.test.mjs
          - consumer: novita
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-novita.test.mjs
          - consumer: gmi
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-gmi.test.mjs
          - consumer: particle
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-particle.test.mjs
          - consumer: longcat
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-longcat.test.mjs
          - consumer: deepgram
            ref: 0066d51dff16526f9a3aa46c534047aba2632918
            test: test/openclaw-deepgram.test.mjs
          - consumer: minimax-m3
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-minimax-m3.test.mjs
          - consumer: minimax-highspeed
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-minimax-highspeed.test.mjs
          - consumer: xai-frozen-chat
            ref: d8bb939408aa4d2be7df0161748edb52ebf3b1fb
            test: test/openclaw-xai-frozen-chat.test.mjs
          - consumer: stepfun
