name: OpenClaw consumer contract

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: openclaw-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  consumer-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - id: select
        run: node scripts/openclaw-contract-changes.mjs

  consumer:
    needs: consumer-changes
    if: ${{ !cancelled() && (needs.consumer-changes.result != 'success' || needs.consumer-changes.outputs.required != 'false') }}
    name: consumer (${{ matrix.consumer }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Temporary first-call diagnostic. Restore the full matrix before landing.
        include:
          - consumer: vercel
            ref: 0093b58c0d132ae1707f9553839f1cf297fb9a25
            test: test/openclaw-vercel.test.mjs
            diagnostic: first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Check out the pinned public consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openclaw/openclaw
          ref: ${{ matrix.ref }}
          path: .openclaw-contract
          persist-credentials: false
          fetch-depth: 1
      - name: Use the consumer's own package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .openclaw-contract/package.json
          dest: ~/setup-pnpm-openclaw
      - name: Cache native pnpm downloads
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: .openclaw-contract/pnpm-lock.yaml
      - name: Install this revision's frozen dependencies
        working-directory: .openclaw-contract
        run: |
          pnpm install --frozen-lockfile
          node -p 'JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})'
          pnpm --version
      - name: Actual consumer through workerd and SQLite
        run: node --test "$CONTRACT_TEST"
        env:
          CONTRACT_TEST: ${{ matrix.test }}
          CLAWROUTER_OPENCLAW_CHECKOUT: .openclaw-contract
          CLAWROUTER_VERCEL_DIAGNOSTIC: ${{ matrix.diagnostic }}


  search-consumer:
    needs: [consumer-changes, consumer]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected consumer
        run: |
          echo "First-call diagnostic only; the full consumer matrix must be restored before landing."
          exit 1
          if [ "$SELECTION_RESULT" = success ] && [ "$CONSUMERS_REQUIRED" = false ]; then
            test "$CONSUMER_RESULT" = skipped
          else
            test "$CONSUMER_RESULT" = success
          fi
        env:
          SELECTION_RESULT: ${{ needs.consumer-changes.result }}
          CONSUMERS_REQUIRED: ${{ needs.consumer-changes.outputs.required }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
