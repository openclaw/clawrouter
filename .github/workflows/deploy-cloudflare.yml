name: Deploy Cloudflare

on:
  schedule:
    - cron: "7 10 * * 1-5"
      timezone: America/Edmonton
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Reviewed full 40-character commit SHA; must match the dispatch commit"
        required: true
        type: string
      live_providers:
        description: "Golden provider ids for mandatory live upstream smoke"
        required: true
        default: openai
        type: string
      openai_smoke_model:
        description: "Optional OpenAI smoke model"
        required: false
        default: ""
        type: string
      configure_provider_secrets:
        description: "Include existing provider transport secrets in the candidate version only"
        required: false
        default: false
        type: boolean
      mode:
        description: "Normal rollout or no-user-traffic rehearsal (zero-failure deliberately fails)"
        default: rollout
        type: choice
        options: [rollout, zero-smoke, zero-failure]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  actions: read

# Includes failure recovery, never cancels an in-progress rollout.
concurrency:
  group: clawrouter-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: candidate
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLAWROUTER_ADMIN_TOKEN_SHA256: ${{ secrets.CLAWROUTER_ADMIN_TOKEN_SHA256 }}
      CLAWROUTER_POLICY_KV_ID: ${{ secrets.CLAWROUTER_POLICY_KV_ID }}
      CLAWROUTER_POLICY_KV_PREVIEW_ID: ${{ secrets.CLAWROUTER_POLICY_KV_PREVIEW_ID }}
      CLAWROUTER_USAGE_QUEUE: ${{ vars.CLAWROUTER_USAGE_QUEUE || 'clawrouter-usage' }}
      CLAWROUTER_USAGE_DLQ: ${{ vars.CLAWROUTER_USAGE_DLQ || 'clawrouter-usage-dead-letter' }}
      CLAWROUTER_WORKER_NAME: ${{ vars.CLAWROUTER_WORKER_NAME || 'clawrouter-edge' }}
      CLAWROUTER_CONTENT_BUCKET: ${{ vars.CLAWROUTER_CONTENT_BUCKET || 'clawrouter-content' }}
      CLAWROUTER_ACCESS_TEAM_DOMAIN: ${{ vars.CLAWROUTER_ACCESS_TEAM_DOMAIN }}
      CLAWROUTER_ACCESS_AUD: ${{ vars.CLAWROUTER_ACCESS_AUD }}
      CLAWROUTER_ACCESS_ADMIN_EMAILS: ${{ vars.CLAWROUTER_ACCESS_ADMIN_EMAILS }}
      CLAWROUTER_ACCESS_ADMIN_DOMAINS: ${{ vars.CLAWROUTER_ACCESS_ADMIN_DOMAINS }}
      CLAWROUTER_ACCESS_DEFAULT_TENANT: ${{ vars.CLAWROUTER_ACCESS_DEFAULT_TENANT }}
      CLAWROUTER_BASE_URL: https://clawrouter.openclaw.ai
      AWS_REGION: ${{ vars.CLAWROUTER_PROVIDER_AWS_REGION || secrets.CLAWROUTER_PROVIDER_AWS_REGION }}
      CLAWROUTER_SMOKE_KEY: ${{ secrets.CLAWROUTER_SMOKE_KEY }}
      CLAWROUTER_SMOKE_LIVE_PROVIDERS: ${{ inputs.live_providers || 'openai' }}
      CLAWROUTER_SMOKE_MODEL_OPENAI: ${{ inputs.openai_smoke_model }}
      CLAWROUTER_SMOKE_MODEL_AWS_BEDROCK: ${{ vars.CLAWROUTER_SMOKE_MODEL_AWS_BEDROCK }}
      CLAWROUTER_SMOKE_BODY_AWS_BEDROCK: ${{ vars.CLAWROUTER_SMOKE_BODY_AWS_BEDROCK }}
      CLAWROUTER_SMOKE_MODEL_AZURE_OPENAI: ${{ vars.CLAWROUTER_SMOKE_MODEL_AZURE_OPENAI }}
      CLAWROUTER_PREFLIGHT_DEPLOY: "1"
      CLAWROUTER_OMIT_ROUTES: "1"
      GH_TOKEN: ${{ github.token }}
      TRAIN_PLAN_PATH: ${{ runner.temp }}/clawrouter-train-plan.json
      TRAIN_STATE_PATH: ${{ runner.temp }}/clawrouter-train-state.json
    steps:
      - name: Verify dispatched deployment source
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Production train must run from main."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then exit 0; fi
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::expected_sha must be a full 40-character hexadecimal commit SHA."
            exit 1
          fi
          EXPECTED_SHA="$(printf '%s' "$EXPECTED_SHA" | tr 'A-F' 'a-f')"
          if [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Dispatched source differs from expected_sha; review the selected ref."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      - name: Select newest exact-SHA green main candidate
        id: select
        working-directory: control
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/deploy-train-select.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.select.outputs.noop == 'false'
        with:
          ref: ${{ steps.select.outputs.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out deployment source
        if: steps.select.outputs.noop == 'false'
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.select.outputs.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checkout differs from selected candidate; refusing deployment."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.select.outputs.noop == 'false'
        with:
          version: 11.28.4
      - if: steps.select.outputs.noop == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.select.outputs.noop == 'false'
        run: pnpm cf:preflight
      - if: steps.select.outputs.noop == 'false'
        run: pnpm worker:check
      - if: steps.select.outputs.noop == 'false'
        run: pnpm --dir admin check
      - if: steps.select.outputs.noop == 'false'
        run: pnpm --dir admin test
      - if: steps.select.outputs.noop == 'false'
        run: pnpm --dir admin build
      - if: steps.select.outputs.noop == 'false'
        run: pnpm cf:content:provision
      - if: steps.select.outputs.noop == 'false'
        run: pnpm cf:config
      - name: Upload, smoke, hold, and promote version
        if: steps.select.outputs.noop == 'false'
        timeout-minutes: 75
        env:
          TRAIN_MODE: ${{ inputs.mode || 'rollout' }}
          CONFIGURE_PROVIDER_SECRETS: ${{ inputs.configure_provider_secrets && 'true' || 'false' }}
          CLAWROUTER_CLOUDFLARE_AI_GATEWAY_OPENAI_API_KEY: ${{ secrets.CLAWROUTER_CLOUDFLARE_AI_GATEWAY_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLAWROUTER_PROVIDER_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLAWROUTER_PROVIDER_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.CLAWROUTER_PROVIDER_AWS_SESSION_TOKEN }}
          AZURE_OPENAI_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.CLAWROUTER_PROVIDER_AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_COMPLETION_TOKEN_DEPLOYMENTS: ${{ secrets.CLAWROUTER_PROVIDER_AZURE_OPENAI_COMPLETION_TOKEN_DEPLOYMENTS }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.CLAWROUTER_PROVIDER_AZURE_OPENAI_ENDPOINT }}
          CLAWROUTER_PROVIDER_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLAWROUTER_PROVIDER_CLOUDFLARE_ACCOUNT_ID }}
          CLAWROUTER_PROVIDER_CLOUDFLARE_AI_GATEWAY_ID: ${{ secrets.CLAWROUTER_PROVIDER_CLOUDFLARE_AI_GATEWAY_ID }}
          CLAWROUTER_PROVIDER_CLOUDFLARE_API_TOKEN: ${{ secrets.CLAWROUTER_PROVIDER_CLOUDFLARE_API_TOKEN }}
          COHERE_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_COHERE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_DEEPSEEK_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_FIRECRAWL_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_FIREWORKS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_GROQ_API_KEY }}
          HUGGINGFACE_API_TOKEN: ${{ secrets.CLAWROUTER_PROVIDER_HUGGINGFACE_API_TOKEN }}
          LANSEQ_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_LANSEQ_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_MINIMAX_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_MISTRAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_OPENROUTER_API_KEY }}
          OPENROUTER_SITE_URL: https://openclaw.ai
          PERPLEXITY_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_PERPLEXITY_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.CLAWROUTER_PROVIDER_REPLICATE_API_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_TAVILY_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_TOGETHER_API_KEY }}
          XAI_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_XAI_API_KEY }}
        run: node ../control/scripts/deploy-train.mjs
      - name: Read back deployed version distribution
        if: always() && steps.select.outputs.noop == 'false'
        run: pnpm exec wrangler deployments list --config .wrangler.generated.toml
      - name: Keep non-secret rollout receipt
        if: always() && steps.select.outputs.noop == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-train-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/clawrouter-train-plan.json
            ${{ runner.temp }}/clawrouter-train-state.json
          if-no-files-found: ignore
          retention-days: 14

  recover-and-alert:
    needs: deploy
    if: always() && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      - name: Recover from remote journal and update the single failure issue
        run: node scripts/deploy-train-recover.mjs
