name: Read-only isolated native authentication

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit; no activation or inference
        required: true
        type: string
      worker:
        description: Prepared isolated clawrouter-native-qualification Worker
        required: true
        type: string
      origin:
        description: Exact isolated Worker HTTPS workers.dev origin
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: clawrouter-native-qualification
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  EXPECTED_SHA: ${{ inputs.expected_sha }}

jobs:
  authenticate:
    environment: native-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guard reviewed main before checkout or credentials
        env:
          AUTH_RECEIPT: ${{ runner.temp }}/native-auth.json
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          const accepted = e.GITHUB_REPOSITORY === 'openclaw/clawrouter' &&
            e.GITHUB_EVENT_NAME === 'workflow_dispatch' && e.GITHUB_REF === 'refs/heads/main' &&
            /^[a-f0-9]{40}$/.test(e.EXPECTED_SHA ?? '') && e.EXPECTED_SHA === e.GITHUB_SHA;
          writeFileSync(e.AUTH_RECEIPT, JSON.stringify({ schema: 1, readOnly: true, qualified: false,
            result: 'blocked', stage: accepted ? 'not-started' : 'source-guard' }) + '\n', { mode: 0o600 });
          if (!accepted) { console.error('Expected exact reviewed main source.'); process.exit(1); }
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Authenticate to the selected isolated Worker
        env:
          AUTH_RECEIPT: ${{ runner.temp }}/native-auth.json
          QUALIFICATION_WORKER: ${{ inputs.worker }}
          QUALIFICATION_ORIGIN: ${{ inputs.origin }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.NATIVE_QUALIFICATION_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NATIVE_QUALIFICATION_CF_ACCOUNT_ID }}
          CLAWROUTER_NATIVE_ADMIN_TOKEN: ${{ secrets.NATIVE_QUALIFICATION_ADMIN_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.NATIVE_QUALIFICATION_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.NATIVE_QUALIFICATION_ACCESS_CLIENT_SECRET }}
        run: node scripts/preflight-native-auth.mjs
      - name: Retain only the content-free authentication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-auth.json
          if-no-files-found: error
          retention-days: 7
