name: Benchmark Fusion

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed commit SHA (must match dispatch ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fusion-live-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Run bounded live comparison
        env:
          OPENROUTER_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_OPENROUTER_API_KEY }}
        run: node scripts/benchmark-fusion.mjs "$RUNNER_TEMP/fusion-results"
      - name: Analyze paired runs
        run: node scripts/evaluate-fusion.mjs "$RUNNER_TEMP/fusion-results/runs.json" --baseline single > "$RUNNER_TEMP/fusion-results/report.json"
      - name: Retain content-free results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fusion-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/fusion-results/*.json
          if-no-files-found: ignore
          retention-days: 14
