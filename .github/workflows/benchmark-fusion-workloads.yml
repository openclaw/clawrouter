name: Benchmark Fusion workloads

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed dispatch commit
        required: true
        type: string
      confirm_inference:
        description: Run paid native inference after offline qualification
        type: boolean
        default: false
      config:
        description: Explicit experiment JSON including prior spend and cumulative cap
        required: true
        type: string
        default: '{"strategies":["strong"],"trials":1,"maxTurns":10,"outputTokens":2048,"deadlineMs":180000,"trialBudgetMicros":200000,"campaignBudgetMicros":100000000,"priorCostMicros":34697983}'

permissions:
  contents: read

concurrency:
  group: fusion-live-benchmark
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FUSION_WORKLOAD_CONFIG: ${{ inputs.config }}
    steps:
      - name: Verify exact source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Preflight the full campaign budget
        run: |
          node --input-type=module <<'JS'
          import { loadTasks } from './scripts/fusion-workloads.mjs';
          import { workloadSets, validateCampaign } from './scripts/run-fusion-workload-campaign.mjs';
          const counts = await Promise.all(workloadSets.map(async set =>
            (await loadTasks(`benchmarks/fusion/${set.manifest}.json`)).length));
          validateCampaign(JSON.parse(process.env.FUSION_WORKLOAD_CONFIG), counts.reduce((a, b) => a + b, 0));
          JS
      - name: Fetch missing pinned task history
        run: |
          node --input-type=module <<'JS'
          import { loadTasks, command } from './scripts/fusion-workloads.mjs';
          import { workloadSets } from './scripts/run-fusion-workload-campaign.mjs';
          const missing = new Set();
          for (const set of workloadSets) for (const task of await loadTasks(`benchmarks/fusion/${set.manifest}.json`)) {
            for (const ref of [task.base, task.oracle, `${task.oracle}^`]) {
              const result = await command('git', ['cat-file', '-e', `${ref}^{commit}`], { allowFailure: true });
              if (result.code) { missing.add(task.base); missing.add(task.oracle); }
            }
          }
          if (missing.size) await command('git', ['-c', 'gc.auto=0', '-c', 'maintenance.auto=false',
            'fetch', '--no-tags', '--no-write-fetch-head', '--depth=2', 'origin', ...missing]);
          JS
      - name: Qualify both corpora without provider credentials
        run: |
          mkdir "$RUNNER_TEMP/fusion-qualification"
          docker pull node:24.22.1-slim
          image=$(docker image inspect node:24.22.1-slim --format '{{index .RepoDigests 0}}')
          for manifest in benchmarks/fusion/*workloads.json; do
            name=$(basename "$manifest" .json)
            node scripts/qualify-fusion-workloads.mjs "$image" "$RUNNER_TEMP/fusion-qualification/$name-qualification.json" "$manifest"
          done
      - name: Check campaign and agent boundaries
        env:
          FUSION_DOCKER_QUALIFICATION: ${{ runner.temp }}/fusion-qualification/workloads-qualification.json
        run: node --test test/fusion-*.test.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Package standalone campaign runner
        run: |
          node --input-type=module <<'JS'
          import { createRequire } from 'node:module';
          const { build } = createRequire(import.meta.resolve('wrangler/package.json'))('esbuild');
          await build({ entryPoints: ['scripts/run-fusion-workload-campaign.mjs'], bundle: true,
            platform: 'node', format: 'esm', outfile: process.env.RUNNER_TEMP + '/fusion-workload-campaign.mjs' });
          JS
      - name: Run the authorized native campaign
        if: ${{ inputs.confirm_inference }}
        env:
          OPENAI_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.CLAWROUTER_PROVIDER_ANTHROPIC_API_KEY }}
          FUSION_CAMPAIGN_MODULE: ${{ runner.temp }}/fusion-workload-campaign.mjs
        run: |
          node --input-type=module <<'JS'
          import { pathToFileURL } from 'node:url';
          const { runWorkloadCampaign } = await import(pathToFileURL(process.env.FUSION_CAMPAIGN_MODULE));
          try {
            await runWorkloadCampaign({ repo: process.cwd(),
              qualificationDir: process.env.RUNNER_TEMP + '/fusion-qualification',
              out: process.env.RUNNER_TEMP + '/fusion-campaign', config: JSON.parse(process.env.FUSION_WORKLOAD_CONFIG) });
          } catch {
            console.error('Workload campaign incomplete; inspect its content-free checkpoint.');
            process.exitCode = 1;
          }
          JS
      - name: Retain content-free qualification and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fusion-workload-campaign-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fusion-qualification/*.json
            ${{ runner.temp }}/fusion-campaign/**/*.json
          if-no-files-found: ignore
          retention-days: 7
