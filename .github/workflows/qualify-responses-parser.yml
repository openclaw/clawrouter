name: Responses parser lock qualification

on:
  push:
    branches: [test/responses-parser-runtime]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          test ! -e node_modules && test ! -L node_modules
          test ! -e admin/node_modules && test ! -L admin/node_modules
          git rev-parse HEAD
          sha256sum package.json pnpm-workspace.yaml pnpm-lock.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parser-lock-${{ github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
