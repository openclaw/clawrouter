name: Observe Cloudflare Queue

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed full main commit SHA; read-only five-minute queue observation
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: clawrouter-production-queue-observation
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QUEUE_RECEIPT_PATH: ${{ github.workspace }}/queue-observation.json
    steps:
      - name: Verify reviewed main source
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main || ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ || "${EXPECTED_SHA,,}" != "$GITHUB_SHA" ]]; then
            echo "::error::Expected reviewed full main SHA."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      - name: Observe only sanitized queue version counts
        run: node scripts/observe-deploy-queue.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: queue-observation-${{ github.run_id }}
          path: ${{ github.workspace }}/queue-observation.json
          if-no-files-found: ignore
          retention-days: 14
